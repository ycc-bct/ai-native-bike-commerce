<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>選車現場 · 展廳視角（淺色版）</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Overpass:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#06038D; --ink:#333; --ink-70:#58626E; --ink-45:#8A8A8E; --line:#DDD;
  --sans:'Open Sans',-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:'Overpass',var(--sans);
  --ease:cubic-bezier(.16,1,.3,1);
  /* 淺色展廳 */
  --room:#EDEEF1; --room-hi:#FBFBFD; --floor:#E4E6EB; --wall:#F7F8FA; --panel:#FFF;
  /* AI 球 */
  --o-deep:#05037A; --o-core:#1230C8; --o-mid:#2B6BF0; --o-lit:#7FB6FF; --o-spec:#BDEBFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--room);overflow:hidden}
button{background:none;border:0;font:inherit;cursor:pointer;color:inherit}

/* ══ 展廳：生成的淺色車店內裝（空景，車由 DOM 疊上去） ══════ */
.room{position:fixed;inset:0;overflow:hidden;background:#FFF}
/* 背景淡化：只作用在背景那一張（.room 的直接子元素）。
   用 .room img 會連 .zones 裡的車圖一起吃掉——車就會跟著半透明。 */
.room>img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;
  opacity:1;filter:saturate(.9) contrast(.97)}
/* 上緣淡出，讓導覽列的字壓得住；下緣稍微壓深，車才有重量 */
.room::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,.72) 0,rgba(255,255,255,0) 13%),
    radial-gradient(84% 70% at 50% 54%,transparent 58%,rgba(126,134,152,.10) 100%)}

/* ══ 三個展區：左右各一組較小、中央一組較大 ══════════════════ */
.zones{position:absolute;inset:0;z-index:3;pointer-events:none}
.zone{position:absolute;text-align:center;transition:opacity .5s var(--ease)}
body.single-focus .zone-l,body.single-focus .zone-r{opacity:0}
/* 中央那組站在後方的展台上（照片裡台面約在 58%），左右兩組站在側邊斜台上、位置較低較前 */
.zone-c{bottom:36.5%}          /* 中央階梯台：兩翼台面約在 64%，頂階再高 8% */
/* 兩側各一台，站在側邊台階上 */
.zone-l{bottom:40.5%}
.zone-r{bottom:40.5%}
.zone-c{left:50%;transform:translateX(-50%);width:45%;z-index:3}
.zone-l{left:6.5%;width:15%;z-index:2}
.zone-r{right:6.5%;width:15%;z-index:2}

/* 標題給一塊半透明白底：壓在石材與牆面上才讀得清楚，形狀沿用站上的 3px 圓角 */
.ztitle{display:inline-block;font-weight:600;color:var(--ink);letter-spacing:.02em;
  font-size:clamp(13px,1vw,17px);line-height:1;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 2px 10px rgba(80,88,104,.10);
  margin-bottom:clamp(10px,1.8vh,22px);transition:opacity .34s var(--ease)}
/* 中央標題改成絕對定位、釘在視窗上的固定高度。
   原本它跟在主角車上方（靠 margin），車圖一高就被推上去壓到背景牆上的 GIANT logo——
   E-bike 那台特別高，差距有 7%。改成 vh 之後六個分類都落在同一條線上。 */
/* 分類列拿掉後，這個標籤是唯一寫著「目前在哪一區」的地方。放在展台前緣的地面上，小而淡。 */
.zone-c .ztitle{position:absolute;left:50%;transform:translateX(-50%);
  bottom:-4.2vh;margin:0;display:inline-block;padding:6px 14px;font-size:12px;letter-spacing:.08em;
  color:var(--ink-70);background:rgba(255,255,255,.5);box-shadow:0 2px 8px rgba(80,88,104,.12)}
.zone-l .ztitle,.zone-r .ztitle{display:none}

.bikes{display:flex;align-items:flex-end;justify-content:center;gap:1%;
  transition:opacity .34s var(--ease),transform .5s var(--ease)}
.bikes.out{opacity:0;transform:translateX(var(--slide,0)) scale(.98)}
/* ── 台面影片（接送小孩流程）─────────────────────────────────
   第一支：台面升起、三台電輔車出現；第二支：只留 Miya 升到中央台。
   車是烤在影片裡的，所以影片模式下我們的車圖不顯示，只把名字、價格和點擊熱區
   放到影片裡三台車的位置（STAGE_SPOTS）。打亮改成一圈柔光，其餘功能不變。 */
.stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;
  opacity:0;transition:opacity .35s ease;pointer-events:none}
.stage-video.on{opacity:1}
body.stage-video .zone-c .bikes{display:block;position:absolute;inset:0;transform:none}
body.stage-video .zone-c .bikes.hide{opacity:0;pointer-events:none}
body.stage-video .zone-c .bike{position:absolute;transform:none!important;margin:0;border-radius:14px;
  transition:background .35s ease,box-shadow .35s ease}
body.stage-video .zone-c .bike>img,body.stage-video .zone-c .bike::before,body.stage-video .zone-c .bike::after{opacity:0}
body.stage-video .zone-c .bike-info{transform:translateX(-50%)!important;transition:opacity .3s ease}
body.stage-video .zone-c .bike.talk-focus{background:radial-gradient(ellipse at 50% 92%,rgba(255,255,255,.34),transparent 68%);
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 34px 6px rgba(255,255,255,.22)}
body.stage-video .zone-c.talking .bike:not(.talk-focus) .bike-info{opacity:.45}
.bike{position:relative;flex:none}
.bike img{width:100%;height:auto;display:block}
.bike-info{display:none}
.zone-c .bike-info{display:flex;position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);
  min-width:126px;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;color:#FFF;
  width:100%;white-space:normal;text-shadow:0 2px 4px rgba(10,15,24,.92),0 0 12px rgba(10,15,24,.72)}
.bike-info b,.bike-info small{font:700 13px/1.3 var(--sans);color:#FFF;opacity:1}
/* 三台車的本體縮放不同，文字做反向縮放，畫面上才會維持相同字級。 */
.zone-c .bike:first-child .bike-info,
.zone-c .bike:last-child .bike-info{transform:translateX(-50%) scale(.877)}
.zone-c .bike:nth-child(2) .bike-info{transform:translateX(-50%) scale(1.136)}
.zone-c .bike{cursor:pointer;pointer-events:auto}
.zone-c .bikes.out .bike{pointer-events:none}
.zone-c .bike:hover>img{filter:drop-shadow(0 10px 15px rgba(6,3,141,.24)) brightness(1.04)}
.zone-c .bike:focus-visible{outline:2px solid #FFF;outline-offset:8px;border-radius:4px}
/* 挑選比較：按「車款比較」後，展台上的車右上角出現圓圈，點一下打勾加入清單 */
.pick-mark{display:none;position:absolute;right:4%;top:6%;width:26px;height:26px;border-radius:50%;
  border:2px solid #FFF;background:rgba(255,255,255,.55);box-shadow:0 3px 10px rgba(30,36,50,.22);
  place-items:center;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.pick-mark::after{content:"";width:11px;height:6px;margin-top:-3px;border-left:2.5px solid #FFF;border-bottom:2.5px solid #FFF;
  transform:rotate(-45deg);opacity:0;transition:opacity .15s}
body.picking .zone-c .bike .pick-mark{display:grid}
.zone-c .bike.picked .pick-mark{background:var(--brand);border-color:var(--brand);transform:scale(1.08)}
.zone-c .bike.picked .pick-mark::after{opacity:1}
body.picking .zone-c .bike.picked>img{filter:drop-shadow(0 10px 15px rgba(6,3,141,.28))}
.zone-c.single .bikes{justify-content:center}
.zone-c.single .bike,.zone-c.single .bike:first-child,.zone-c.single .bike:last-child{
  width:min(52%,48vh);transform:translateY(-2.4vw) scale(1);transform-origin:50% 100%;z-index:1}
.zone-c.single .bike-info{transform:translateX(-50%)}
/* 接地陰影：前後輪各一顆，不是整台車一道。
   位置是量 25 張去背圖最底 4% 的不透明像素得到的——側視圖後輪中心約 20%、前輪約 80%；
   45 度圖（左右兩區）的後輪被透視推高，最低點在圖高 5% 附近，所以另外給一組值。 */
.bike::before,.bike::after{content:"";position:absolute;height:3.2%;border-radius:50%;
  filter:blur(1px);opacity:.72;
  background:radial-gradient(ellipse at 50% 50%,rgba(43,48,58,.6),rgba(71,76,88,.18) 48%,transparent 74%)}
/* 側視車的兩個輪胎在去背素材裡同高，陰影要緊貼輪底；原本放到 -3%，
   影子會和輪胎斷開，視覺上反而像浮在台面上。 */
.bike::before{left:10%;width:20%;bottom:-.35%}    /* 後輪 */
.bike::after {left:70%;width:20%;bottom:-.35%}    /* 前輪 */
/* 45 度素材因透視關係，後輪最低點比前輪高約 8–12% 圖高。
   分開貼住兩個輪底，才會順著左右斜台站穩。 */
.zone-l .bike::before,.zone-r .bike::before{left:8%;width:21%;bottom:8.2%}
.zone-l .bike::after ,.zone-r .bike::after {left:64%;width:25%;bottom:.1%}
.bike .refl{display:none}   /* 照片地板本身就有反射，再疊一層會打架 */
/* 中央：左右兩台站在前層，中間一台位於較遠的高台，因此尺寸更小。 */
.zone-c .bikes{gap:0}
.zone-c .bike{width:min(38%,34vh);z-index:1}
.zone-c.pair .bike:first-child{--left-x:-3vw;--left-y:.4vw;--left-scale:1.06}
.zone-c.pair .bike:last-child{--right-x:3vw;--right-y:.4vw;--right-scale:1.06}     /* 同時受高度限制，超寬螢幕不再把車放到跨出台面 */
/* 兩翼車以輪底為縮放原點，縮小後仍貼著前層平台；往中央收一點，
   避免外側輪胎越過圓台左右邊界。 */
.zone-c .bike:first-child{transform:translateX(var(--left-x,4vw)) translateY(var(--left-y,1.15vw)) scale(var(--left-scale,1.14));transform-origin:50% 100%}
.zone-c .bike:last-child{transform:translateX(var(--right-x,-4vw)) translateY(var(--right-y,1.15vw)) scale(var(--right-scale,1.14));transform-origin:50% 100%}
.zone-c .bike:nth-child(2){width:min(44%,42vh);transform:translateY(var(--main-y,-3.25vw)) scale(var(--main-scale,.88));transform-origin:50% 100%;z-index:0}  /* 頂階較遠，比例應比前層兩台小 */
/* 每個分類保留獨立接地參數。現在各組輪底都對齊同一座展台；之後若替換
   某張車圖，只需調該分類，不會再牽動其餘五區。 */
.zone-c[data-cat="new"]   {--left-y:1.15vw;--right-y:1.15vw;--main-y:-3.25vw}
.zone-c[data-cat="daily"] {--left-y:1.15vw;--right-y:1.12vw;--main-y:-3.22vw}
.zone-c[data-cat="ebike"] {--left-y:1.18vw;--right-y:1.16vw;--main-y:-3.18vw}
.zone-c[data-cat="gravel"]{--left-y:1.14vw;--right-y:1.16vw;--main-y:-3.22vw}
.zone-c[data-cat="mtb"]   {--left-y:1.15vw;--right-y:1.15vw;--main-y:-3.24vw}
.zone-c[data-cat="kids"]  {--left-y:1.17vw;--right-y:1.16vw;--main-y:-3.20vw}
/* 抬升用 vw 不用 %：% 是相對車圖自己的高度，而每台車的圖比例不同，
   換分類時主角車就會忽高忽低。固定成 vw 之後每台的輪底都落在同一條線上。 */
.zone-l .bike,.zone-r .bike{width:min(84%,31vh);cursor:pointer;pointer-events:auto;transition:filter .3s ease}
.zone-l .bike:hover>img,.zone-r .bike:hover>img{filter:drop-shadow(0 10px 15px rgba(6,3,141,.24)) brightness(1.05)}
.zone-l .bike:focus-visible,.zone-r .bike:focus-visible{outline:2px solid #FFF;outline-offset:8px;border-radius:4px} /* 左右斜台車縮小並受視窗高度限制 */
/* 45 度原圖是車頭朝右，所以改鏡射左邊：兩台的車頭都朝畫面外側。
   鏡射掛在 .bike 上（不是 img），接地陰影才會一起翻面。
   注意鏡射那一側的 GIANT 字會反、傳動系統會跑到非驅動側——
   要根治得補一張「車頭朝左、拍非驅動側」的 45 度圖。 */
/* 左右斜台約為 15°；45 度車圖本身已有約 6° 的前後輪高差，
   再補 9° 讓兩輪順著斜面。整車上移 1.8vh，使兩輪完整落在台面區域內，
   而不是壓到平台前緣；左右採鏡像角度。 */
.zone-l .bike{transform:translateY(-1.8vh) rotate(-9deg) scaleX(-1) skewX(1deg);transform-origin:50% 100%}
.zone-r .bike{transform:translateY(-1.8vh) rotate(9deg);transform-origin:50% 100%}

/* ══ 上方分類列 ══════════════════════════════════════════ */
/* 上緣只留「有人在」和出口。分類列拿掉了：往左右走靠箭頭、兩側的車、或直接跟店員說。 */
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.who{display:flex;align-items:center;gap:10px}
.who .mark{width:20px;color:var(--brand);display:flex;opacity:.85}.who .mark svg{width:100%;height:auto}
.who b{font-size:14px;font-weight:600;display:block;line-height:1;color:var(--ink-70)}
.who small{font-size:11px;color:var(--ink-45);display:flex;align-items:center;gap:8px;margin-top:6px;line-height:1}
.who small i{width:4px;height:4px;background:var(--brand);border-radius:50%;display:block}
.close{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-70);opacity:.85}
.close:hover{color:var(--ink);opacity:1}
.close svg{width:20px;height:20px}

/* ══ 左右切換 ══════════════════════════════════════════════ */
/* 分類切換固定在左右展區下緣，不跟 AI 球一起沉到畫面底部。 */
.arrow{min-width:52px;height:52px;display:flex;align-items:center;justify-content:center;gap:12px;
  /* 淺色箭頭：地板是中灰，白色描邊配一道淡投影才立得住 */
  color:#FFF;opacity:.85;filter:drop-shadow(0 1px 3px rgba(40,46,60,.38));
  transition:opacity .2s,transform .3s var(--ease);
  position:fixed;top:68%;z-index:22;transform:translateY(-50%)}
.arrow.l{left:34px}.arrow.r{right:34px}
.arrow:hover{opacity:1}
.arrow.l:hover{transform:translate(-4px,-50%)}
.arrow.r:hover{transform:translate(4px,-50%)}
.arrow svg{width:32px;height:32px}
.arrow-label{min-width:88px;padding:8px 13px;border:1px solid rgba(255,255,255,.52);border-radius:999px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  color:var(--ink);font-size:14px;font-weight:600;line-height:1;white-space:nowrap;text-align:center;
  box-shadow:0 4px 14px rgba(54,61,76,.12)}
.arrow[hidden]{display:none}
.pick-tray[hidden]{display:none}
.pick-tray{position:fixed;right:34px;bottom:26px;z-index:61;width:300px;padding:14px 16px 16px;
  border:1px solid rgba(255,255,255,.7);border-radius:12px;background:rgba(255,255,255,.8);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(54,61,76,.16);
  color:var(--ink);font-size:13px;animation:trayIn .4s var(--ease)}
@keyframes trayIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pick-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pick-head b{font:700 14px var(--num);color:var(--ink)}
.pick-head button{min-height:32px;padding:4px 0;color:var(--ink-70);text-decoration:underline;text-underline-offset:4px}
.pick-head button:hover{color:var(--ink)}
.pick-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:12px}
.pick-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border:1px solid #C9CDD6;border-radius:999px;
  background:#FFF;font-size:13px;font-weight:600;color:var(--ink)}
.pick-chip button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--ink-70);font-size:15px;line-height:1}
.pick-chip button:hover{background:#ECEEF3;color:var(--ink)}
.pick-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick-hint{color:var(--ink-70)}
.pick-go{min-height:40px;padding:8px 18px;border-radius:999px;background:var(--brand);color:#FFF;font-weight:700;
  transition:opacity .2s,background .2s}
.pick-go:hover{background:#0A07B0}
.pick-go:disabled{opacity:.38;cursor:not-allowed}

/* ══ AI 球（中下） ══════════════════════════════════════════ */
.dock{--orb:112px;position:fixed;z-index:60;left:0;right:0;bottom:calc(var(--orb)*-.58);
  display:flex;justify-content:center;align-items:flex-end;gap:clamp(16px,3vw,44px);padding:0 20px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock-mid{display:flex;flex-direction:column;align-items:center;gap:9px;width:min(380px,54vw)}
/* 球底下的同心圈，對應主管圖裡的地面光環 */
.rings{position:absolute;left:50%;top:calc(var(--size,96px)*.5);transform:translate(-50%,-50%);
  width:calc(var(--size,96px)*3.4);height:calc(var(--size,96px)*1.5);pointer-events:none;display:none}
.rings i{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);border-radius:50%;
  animation:ring 4.6s var(--ease) infinite}
.rings i:nth-child(2){animation-delay:1.5s}
.rings i:nth-child(3){animation-delay:3s}
@keyframes ring{0%{transform:scale(.55);opacity:0}25%{opacity:.85}100%{transform:scale(1.25);opacity:0}}

/* ── AI 球本體（與 orb.html 同一份） ─────────────────────── */
.orb{--size:96px;position:relative;width:var(--size);height:var(--size);flex:none;isolation:isolate}
.orb::before{content:"";position:absolute;inset:-18%;border-radius:50%;z-index:0;
  background:radial-gradient(circle at 42% 62%,
    color-mix(in srgb,var(--o-mid) 62%,transparent) 0%,
    color-mix(in srgb,var(--o-core) 26%,transparent) 46%,transparent 72%);
  filter:blur(calc(var(--size)*.09));animation:orbHalo 5.5s var(--ease) infinite}
.orb-ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1;
  background:radial-gradient(circle at 30% 74%,var(--o-spec) 0%,var(--o-lit) 18%,var(--o-mid) 40%,var(--o-core) 68%,var(--o-deep) 100%);
  box-shadow:0 calc(var(--size)*.10) calc(var(--size)*.22) color-mix(in srgb,var(--o-deep) 34%,transparent),
             inset 0 0 calc(var(--size)*.20) color-mix(in srgb,var(--o-deep) 55%,transparent);
  animation:orbBreathe 5.5s var(--ease) infinite, orbMorph 12s ease-in-out infinite}
.orb-flow{position:absolute;inset:-12%;animation:orbSpin 26s linear infinite;will-change:transform}
.blob{position:absolute;border-radius:50%;filter:blur(calc(var(--size)*.16));will-change:transform}
.b1{width:70%;height:70%;left:-4%;top:38%;background:var(--o-spec);opacity:.95;animation:orbDrift1 9s ease-in-out infinite}
.b2{width:74%;height:74%;left:40%;top:-8%;background:var(--o-deep);opacity:.85;animation:orbDrift2 11s ease-in-out infinite}

@keyframes orbIdleHalo{0%,100%{transform:scale(.94);opacity:.38}50%{transform:scale(1.04);opacity:.58}}

const BIKE_PRICE = Object.fromEntries(Object.entries(BIKE_DETAILS).map(([name,[price]]) => [name,'NT$'+price.toLocaleString('en-US')]));
const ICON = {
  new   :'<rect x="1.5" y="6" width="21" height="12" rx="2" stroke-width="2"/><text x="12" y="12.4" text-anchor="middle" dominant-baseline="central" font-family="Open Sans, sans-serif" font-size="8" font-weight="700" fill="currentColor" stroke="none">NEW</text>',
  daily :'<circle cx="3.667" cy="11.667" r="2.333"/><circle cx="12.333" cy="11.667" r="2.333"/><circle cx="10" cy="3.333" r="0.667"/><path d="M8 11.667V9.333L6 7.333l2.667-2L10 7.333h1.333"/>',
  ebike :'<path d="M9.5 2 4 9.2h3.6L6.5 14 12 6.8H8.4L9.5 2Z"/>',
  gravel:'<path d="M4 14 6.8 2.6"/><path d="M12 14 9.2 2.6"/><path d="M8 4.6v1.7M8 8.6v1.7M8 12.6V14"/>',
  mtb   :'<path d="M1.8 13.6 6.2 4.8l3.2 5.4 1.9-3.2 3.1 6.6Z"/>',
  kids  :'<circle cx="5.2" cy="4.2" r="1.9"/><path d="M2 14v-2.2a3.2 3.2 0 0 1 6.4 0V14"/><circle cx="11.6" cy="7.2" r="1.5"/><path d="M9.1 14v-1.4a2.5 2.5 0 0 1 5 0V14"/>'

const icon = k => '<svg viewBox="' + (k === 'new' ? '0 0 24 24' : '0 0 16 16') + '" fill="none" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg>';

/* 用 Bikes/trim/ 這份去留白的副本：原圖底部有 0–16% 不等的透明留白，
   直接用會讓車浮在展台上方、而且每張浮的高度都不一樣。原始檔沒有更動。 */
const src = (dir, name) => encodeURI('Bikes/trim/' + dir + '/' + name + '.webp');
function itemsOf(c, n){
  if (c.k === 'new') return NEW_SET.slice(0, n).map(([d, b]) => ({url:src(d, b), name:b}));
  const names = c.k === 'ebike' && selectedMiya ? ['Miya E+']
    : c.k === 'ebike' && childRecommendation ? CHILD_SETS[childSet] : BIKES[c.dir].slice(0, n);
  /* Faster E+ 放在日常騎乘的資料夾，所以用 bikeUrl 找圖，不能只靠目前分類的 dir */
  return names.slice(0, n).map(name => ({url:bikeUrl(name) || src(c.dir, name), name}));
}
/* 左右兩側改用各分類的 45 度角車圖；「新車上市」沒有自己的資料夾，
   借 NEW_SET 第一台所在的分類。右側靠 CSS 水平翻轉，不另外存一份圖。 */
const side45 = c => src(c.k === 'new' ? NEW_SET[0][0] : c.dir, '45');
function bikeHTML(item, withInfo = false){
  const u = typeof item === 'string' ? item : item.url;
  const info = withInfo && item.name
    ? '<span class="bike-info"><b>' + item.name + '</b><small>' + (BIKE_PRICE[item.name] || '') + '</small></span>'
    : '';
  const tag = withInfo ? 'button' : 'div';
  const attr = withInfo ? ' type="button" data-pick="' + item.name + '" aria-label="介紹 ' + item.name + '"' : '';
  const mark = withInfo ? '<i class="pick-mark" aria-hidden="true"></i>' : '';
  return '<' + tag + ' class="bike"' + attr + '><img alt="' + (item.name || '') + '" src="' + u + '">' +
         '<span class="refl" aria-hidden="true"><img alt="" src="' + u + '"></span>' + info + mark + '</' + tag + '>';
}

let i = 0;                                   /* 中央目前是哪一個分類 */
let childRecommendation = false;
let selectedMiya = false;
const zones = {
  l: document.querySelector('.zone-l'),
  c: document.querySelector('.zone-c'),
  r: document.querySelector('.zone-r')
};
const at = k => CATS[(k % CATS.length + CATS.length) % CATS.length];

function paint(dir){
  document.body.classList.toggle('single-focus', selectedMiya);
  const plan = [['l', at(i - 1), 1], ['c', at(i), 3], ['r', at(i + 1), 1]];
  plan.forEach(([z, cat, n]) => {
    const zone = zones[z], box = zone.querySelector('.bikes'), ttl = zone.querySelector('.ztitle');
    if (dir !== 0){
      box.style.setProperty('--slide', dir > 0 ? '-28px' : '28px');
      box.classList.add('out');
      if (ttl) ttl.style.opacity = '0';
    }
    setTimeout(() => {
      zone.dataset.cat = cat.k;
      const center = z === 'c';
      const recommendationView = center && (childRecommendation || selectedMiya) && cat.k === 'ebike';
      const renderedItems = center ? itemsOf(cat, n) : [side45(cat)];
      box.innerHTML = renderedItems.map(item => bikeHTML(item, center)).join('');
      if (center) activeBikeIndex = renderedItems.length === 1 ? 0 : 1;
      zone.classList.toggle('recommendation', recommendationView);
      zone.classList.toggle('single', center && selectedMiya && cat.k === 'ebike');
      zone.classList.toggle('pair', center && renderedItems.length === 2);
      if (center){
        box.querySelectorAll('.bike[data-pick]').forEach((bike, index) => {
          bike.onclick = () => picking ? togglePick(renderedItems[index]) : introduceBike(bike.dataset.pick, index);
        });
        renderPicks();
        if (stageMode) layoutStageSpots();
      } else {
        /* 左右兩側的車點下去＝切到那個分類，和箭頭同一件事 */
        const side = box.querySelector('.bike');
        side.setAttribute('role', 'button'); side.tabIndex = 0;
        side.setAttribute('aria-label', '前往' + cat.label);
        side.onclick = () => go(z === 'l' ? -1 : 1);
        side.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(z === 'l' ? -1 : 1); } };
      }
      if (ttl) ttl.textContent = cat.label;
      /* 先落在反方向的起點，下一拍再滑回原位。
         不用 requestAnimationFrame——分頁在背景時 rAF 不會執行，
         .out 會永遠拿不掉，整排車就停在 opacity:0、位移 28px 的狀態。 */
      if (dir !== 0){
        box.style.setProperty('--slide', dir > 0 ? '28px' : '-28px');
        void box.offsetWidth;
        setTimeout(() => {
          box.classList.remove('out');
          if (ttl) ttl.style.opacity = '';
        }, 24);
      }
    }, dir === 0 ? 0 : 300);
  });
  const prevCat = at(i - 1), nextCat = at(i + 1);
  document.getElementById('prevLabel').textContent = prevCat.label;
  document.getElementById('nextLabel').textContent = nextCat.label;
  document.getElementById('prev').setAttribute('aria-label', '前往' + prevCat.label);
  document.getElementById('next').setAttribute('aria-label', '前往' + nextCat.label);
}

const clerk = document.getElementById('clerk');
const clerkCopy = document.getElementById('clerkCopy');
const clerkInput = document.getElementById('clerkInput');
const clerkForm = document.getElementById('clerkForm');
const inputChoices = document.getElementById('inputChoices');
const keyboardChoice = document.getElementById('keyboardChoice');
const micChoice = document.getElementById('micChoice');
const micBtn = document.getElementById('micBtn');
const orb = document.getElementById('orb');
const quickActions = document.getElementById('quickActions');
const compareThree = document.getElementById('compareThree');
const exploreMore = document.getElementById('exploreMore');
const compareQuick = document.getElementById('compareQuick');
const compareModal = document.getElementById('compareModal');
const compareClose = document.getElementById('compareClose');
const compareTable = document.getElementById('compareTable');
const compareTitle = document.getElementById('compareTitle');
const sizeQuick = document.getElementById('sizeQuick');
const sizeModal = document.getElementById('sizeModal');
const sizeClose = document.getElementById('sizeClose');
const sizeTitle = document.getElementById('sizeTitle');
const sizeSummary = document.getElementById('sizeSummary');
const sizeChart = document.getElementById('sizeChart');
const sizeUnits = document.querySelector('.size-units');
const accessoryPanel = document.getElementById('accessoryPanel');
const accessorySkip = document.getElementById('accessorySkip');
const clerkSubmit = clerkForm.querySelector('.clerk-submit');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let clerkTimers = [], clerkRun = 0, recognition = null;
let recommendationStep = 0;
let activeBikeIndex = 1, sizingMode = false;
let knownHeight = null, sizeUnit = 'cm';
let picking = false, picks = [];
/* 台面影片：null＝靜態背景；'up'＝停在第一支最後一格；'down'＝停在第二支最後一格 */
const stageUp = document.getElementById('stageUp');
const stageDown = document.getElementById('stageDown');
let stageMode = null;
/* 影片先整支抓下來再餵給 <video>：Safari 遇到不支援 Range 的伺服器（例如 python -m http.server）
   會直接不播、畫面空白；用 blob 就不再依賴伺服器，也等於預載完成。抓不到（file://）就退回直接指路徑。 */
[stageUp, stageDown].forEach(video => {
  fetch(video.dataset.src).then(r => r.ok ? r.blob() : Promise.reject(r.status))
    .then(blob => { if (!video.classList.contains('on')){ video.src = URL.createObjectURL(blob); video.load(); } })
    .catch(() => { if (!video.src) video.src = video.dataset.src; });
});
/* 等到影片真的能播（或最多等 5 秒）再開始；fetch 還沒回來就直接指檔案路徑讓瀏覽器自己載 */
function whenPlayable(video){
  return new Promise(resolve => {
    if (video.readyState >= 3) return resolve();
    const ok = () => { video.removeEventListener('canplay', ok); clearTimeout(t); resolve(); };
    const t = setTimeout(ok, 5000);
    video.addEventListener('canplay', ok);
    if (!video.src) video.src = video.dataset.src;
    video.load();
  });
}
/* 影片裡車的位置（相對影片畫面的 left, top, width, height）。影片重出時這組要跟著量。 */
const STAGE_SPOTS = {
  up:   {'EA-102':[.31,.48,.16,.15], 'Miya E+':[.40,.39,.21,.21], 'EA-402':[.53,.50,.18,.13]},
  down: {'Miya E+':[.39,.38,.22,.18]}
};
function stageFrame(){
  const W = innerWidth, H = innerHeight, k = Math.max(W / 1920, H / 1080), w = 1920 * k, h = 1080 * k;
  return {x:(W - w) / 2, y:(H - h) / 2, w, h};
}
function layoutStageSpots(){
  if (!stageMode) return;
  const f = stageFrame(), spots = STAGE_SPOTS[stageMode];
  /* .zone-c 帶 transform，裡面的定位是相對它的框，不是視窗；先扣掉容器原點 */
  const origin = zones.c.querySelector('.bikes').getBoundingClientRect();
  zones.c.querySelectorAll('.bike[data-pick]').forEach(b => {
    const sp = spots[b.dataset.pick];
    if (!sp){ b.style.display = 'none'; return; }
    b.style.display = '';
    b.style.left = (f.x + sp[0] * f.w - origin.left) + 'px'; b.style.top = (f.y + sp[1] * f.h - origin.top) + 'px';
    b.style.width = (sp[2] * f.w) + 'px';     b.style.height = (sp[3] * f.h) + 'px';
  });
}
addEventListener('resize', layoutStageSpots);
function playStage(video, onEnd, onFail){
  let finished = false, guard = null;
  const done = () => {
    if (finished) return;
    finished = true; clearTimeout(guard);
    video.removeEventListener('ended', done);
    /* 停在最後一格；duration 還沒讀到就不要動 currentTime（非有限值會直接丟例外，整個流程卡住） */
    if (!video.ended && isFinite(video.duration)){ video.pause(); video.currentTime = Math.max(0, video.duration - .05); }
    onEnd();
  };
  whenPlayable(video).then(() => {
    /* 等了 5 秒還沒有畫面（網路慢、分頁在背景）：放棄影片，回到靜態展台用車圖 */
    if (video.readyState < 2){ onFail(); return; }
    if (isFinite(video.duration)) video.currentTime = 0;
    video.playbackRate = 1.25;
    video.classList.add('on');                 /* 有畫面了才蓋上去，載入失敗時展間仍在 */

   自動播放，第一次點擊球、分類、鍵盤或麥克風後就會正常發聲。 */
let soundContext = null;
function emitClerkTones(kind){
  const now = soundContext.currentTime;
  const notes = kind === 'listening'
    ? [{hz:660, at:0, len:.1}, {hz:880, at:.075, len:.14}]
    : [{hz:740, at:0, len:.12}, {hz:988, at:.09, len:.18}];
  notes.forEach(({hz, at, len}) => {
    const oscillator = soundContext.createOscillator();
    const gain = soundContext.createGain();
    oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(hz, now + at);
    gain.gain.setValueAtTime(.0001, now + at);
    gain.gain.exponentialRampToValueAtTime(.026, now + at + .018);
    gain.gain.exponentialRampToValueAtTime(.0001, now + at + len);
    oscillator.connect(gain).connect(soundContext.destination);
    oscillator.start(now + at); oscillator.stop(now + at + len + .02);
  });
}
function playClerkSound(kind = 'message'){
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  soundContext ||= new AudioContext();
  if (soundContext.state === 'running') return emitClerkTones(kind);
  soundContext.resume().then(() => {
    if (soundContext.state === 'running') emitClerkTones(kind);
  }).catch(() => {});
}

  clerkTimers.push(setTimeout(() => {
    if (run !== clerkRun) return;
    setClerkState('speaking'); setBikeFocus(null); showClerkCopy(line); playClerkSound();
  }, 380));
  clerkTimers.push(setTimeout(() => { if (run === clerkRun) setClerkState('idle'); }, 3200));
  autoIntroduceChildren(380);
};
/* 點鍵盤也算「有動作」，把自動介紹停掉 */
keyboardChoice.addEventListener('click', () => clearClerkSequence(false));
function closeCompare(){
  compareModal.hidden = true;
  compareQuick.focus();
  say(picks.length
    ? '比較先收起來，清單還留著。\n想再比，按車款比較；想縮到一台，跟我說平常怎麼騎。'
    : '比較先收起來。\n想看哪台，直接點展台上的車。', 4200);
}
function comparisonItems(){
  const cat = at(i);
  if (cat.k === 'ebike' && selectedMiya){
    return BIKES['E-bike'].slice(0,3).map(name => ({name,url:src('E-bike',name)}));
  }
  return itemsOf(cat,3);
}
function openCompare(list, title, spoken){
  const cat = at(i), products = list || comparisonItems();
  const editable = !!list;                       /* 自己挑的清單才能在表上移除／再加 */
  compareTitle.textContent = title || (cat.label + '｜車款比較');
  document.getElementById('compareIntro').textContent = (list ? '比較你挑的 ' + products.length + ' 台車' : '比較目前展台上的車款') + '；實際配備與售價仍建議到門市確認。';
  const addCol = editable && products.length < 3;
  compareTable.innerHTML =
    '<thead><tr><th>比較項目</th>' + products.map(item =>
      '<th><span class="compare-product"><img src="' + item.url + '" alt="' + item.name + '"><span>' + item.name + '</span>' +
      (editable ? '<button type="button" class="compare-remove" data-remove="' + item.name + '">× 移除</button>' : '') + '</span></th>'
    ).join('') + (addCol ? '<th><button type="button" class="compare-add" id="compareAdd"><i>＋</i>再加一台</button></th>' : '') + '</tr></thead><tbody>' +
    '<tr><th>價格</th>' + products.map(item => '<td class="price">' + BIKE_PRICE[item.name] + '</td>').join('') + (addCol ? '<td></td>' : '') + '</tr>' +
    '<tr><th>適合情境</th>' + products.map(item => '<td>' + BIKE_DETAILS[item.name][1] + '</td>').join('') + (addCol ? '<td></td>' : '') + '</tr>' +
    '</tbody>';
  sizeModal.hidden = true;
  compareModal.hidden = false;
  /* 開比較表時店員也要說一句：講事實（幾台、價格帶），下一步交給使用者 */
  clearClerkSequence(false);
  engage();
  const prices = products.map(item => BIKE_DETAILS[item.name][0]);
  const low = Math.min(...prices), high = Math.max(...prices);
  const line = spoken || (products.length > 1
    ? '這 ' + products.length + ' 台我放在一起了，價格從 NT$' + low.toLocaleString('en-US') + ' 到 NT$' + high.toLocaleString('en-US') + '。\n跟我說平常怎麼騎、預算大概多少，我幫你縮到一台。'
    : products[0].name + ' 的價格和適合情境整理在上面了。\n按「再加一台」或直接跟我說要加哪台。');
  const run = clerkRun;
  clerkTimers.push(setTimeout(() => {
    if (run !== clerkRun) return;
    setClerkState('speaking'); showClerkCopy(line); playClerkSound();
  }, 380));
  clerkTimers.push(setTimeout(() => { if (run === clerkRun) setClerkState('idle'); }, 3400));
}
/* ── 車款比較：使用者自己挑 ───────────────────────────────── */
const pickTray = document.getElementById('pickTray');
const pickCount = document.getElementById('pickCount');
const pickChips = document.getElementById('pickChips');
const pickHint = document.getElementById('pickHint');
const pickGo = document.getElementById('pickGo');
const pickCancel = document.getElementById('pickCancel');
function say(line, hold = 3000){
  clearClerkSequence(false);
  engage();
  const run = clerkRun;
  clerkTimers.push(setTimeout(() => {
    if (run !== clerkRun) return;
    setClerkState('speaking'); showClerkCopy(line); playClerkSound();
  }, 300));
  clerkTimers.push(setTimeout(() => { if (run === clerkRun) setClerkState('idle'); }, 300 + hold));
}
function renderPicks(){
  pickCount.textContent = '比較 ' + picks.length + '/3';
  pickChips.innerHTML = picks.map(p =>
    '<span class="pick-chip">' + p.name + '<button type="button" data-remove="' + p.name + '" aria-label="移除 ' + p.name + '">×</button></span>'
  ).join('');
  pickHint.textContent = picks.length < 2 ? '點展台上的車加入' : picks.length < 3 ? '還可以再選一台' : '三台已選滿';
  pickGo.disabled = picks.length < 2;
  zones.c.querySelectorAll('.bike[data-pick]').forEach(bike => {
    const on = picks.some(p => p.name === bike.dataset.pick);
    bike.classList.toggle('picked', on);
    bike.setAttribute('aria-pressed', String(on));
  });
}
function startPicking(){
  sizeModal.hidden = true;                      /* 一次只開一個：尺寸表先收 */
  picking = true;
  document.body.classList.add('picking');
  pickTray.hidden = false;
  renderPicks();
  say(picks.length
    ? '比較清單還留著，可以再加一台，或直接按開始比較。'
    : '點展台上的車，選 2 到 3 台，我把它們放在一起比。\n想比別的分類，用左右箭頭切過去再選。', 4200);
}
function stopPicking(clear){
  picking = false;
  document.body.classList.remove('picking');
  pickTray.hidden = true;
  if (clear) picks = [];
  renderPicks();
}
function togglePick(item){
  const idx = picks.findIndex(p => p.name === item.name);
  if (idx >= 0){
    picks.splice(idx, 1); renderPicks();
    say(item.name + ' 已移出比較。');
    return;
  }
  if (picks.length >= 3){
    say('一次最多比三台，先移掉一台再加 ' + item.name + '。');
    return;
  }
  picks.push({name:item.name, url:item.url}); renderPicks();
  say(item.name + ' 已加入比較。\n' + (picks.length < 2 ? '再選一台就可以開始比。' : picks.length < 3 ? '還可以再選一台，或直接開始比較。' : '三台都齊了，按開始比較。'));
}
compareQuick.onclick = () => { if (compareModal.hidden) startPicking(); };
const bikeUrl = name => {
  for (const [dir, names] of Object.entries(BIKES)) if (names.includes(name)) return src(dir, name);
  return '';
};
/* 從一句話裡找出車名；「Escape」「Escape Disc 2」同時命中時只留較長的那個 */
const squash = t => t.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, '');   /* ea 102 / EA-102 / ea102 都算同一台 */
function bikesNamed(text){
  const flat = squash(text);
  const hits = Object.keys(BIKE_DETAILS).filter(n => flat.includes(squash(n)));
  return hits.filter(n => !hits.some(o => o !== n && squash(o).includes(squash(n))));
}
/* 「第二台」「最後一台」「中間那台」這類指的是比較清單裡的順序 */
function ordinalPicks(text){
  const map = [[/第一台|第1台|左邊/, 0], [/第二台|第2台|中間/, 1], [/第三台|第3台/, 2], [/最後一台|右邊/, picks.length - 1]];
  return map.filter(([re]) => re.test(text)).map(([, n]) => picks[n]).filter(Boolean).map(p => p.name);
}
const listPicks = () => picks.map(p => p.name).join('、');
function goPickMore(){
  compareModal.hidden = true;
  startPicking();
  say('點展台上的車再加一台，或直接跟我說車名。\n想比別的分類，用左右箭頭切過去。', 4200);
}
function addPick(name){
  if (picks.some(p => p.name === name)) return name + ' 已經在比較清單裡了。';
  if (picks.length >= 3) return '一次最多比三台，先移掉一台再加 ' + name + '。';
  picks.push({name, url:bikeUrl(name)});
  return name + ' 已加入比較。';
}
function removePick(name){
  const idx = picks.findIndex(p => p.name === name);
  if (idx < 0) return name + ' 不在比較清單裡。';
  picks.splice(idx, 1);
  return name + ' 已移出比較。';
}
/* 清單變了之後：表開著就重畫表，否則更新托盤 */
function afterPickChange(line){
  renderPicks();
  if (!compareModal.hidden){
    if (picks.length) openCompare(picks.slice(), '車款比較', line + '\n' + (picks.length < 3 ? '想再加，按「再加一台」或直接說車名。' : '三台都齊了，跟我說平常怎麼騎，我幫你縮到一台。'));
    else { compareModal.hidden = true; startPicking(); }
    return;
  }
  if (!picking) startPicking();
  say(line + (picks.length < 2 ? '\n再選一台就可以開始比。' : '\n還可以再加，或直接開始比較。'));
}
compareTable.onclick = event => {
  const remove = event.target.closest('button[data-remove]');
  if (remove){ afterPickChange(removePick(remove.dataset.remove)); return; }
  if (event.target.closest('#compareAdd')) goPickMore();
};
pickGo.onclick = () => { stopPicking(false); openCompare(picks.slice(), '車款比較'); };
pickCancel.onclick = () => { stopPicking(true); say('好，比較先取消。想比的時候再按車款比較。'); };
pickChips.onclick = event => {
  const button = event.target.closest('button[data-remove]');
  if (button) togglePick({name:button.dataset.remove});
};
compareClose.onclick = closeCompare;
compareModal.onclick = event => { if (event.target === compareModal) closeCompare(); };
function selectedProduct(){
  const products = itemsOf(at(i),3);
  return products[Math.min(activeBikeIndex, products.length - 1)] || products[0];
}
function recommendedFrame(height){
  if (height < 165) return 'XS';
  if (height <= 175) return 'S';
  if (height <= 181) return 'M';
  return 'M/L';
}
function handleSizeInput(text){
  const match = text.match(/(1[2-9]\d|20\d|210)(?:\.\d+)?/);
  if (!match){
    showClerkCopy('我還沒看出身高，可以輸入像「172 cm」這樣的數字。');
    clerkInput.focus();
    return;
  }
  sizingMode = false;
  clerkInput.placeholder = '想找什麼樣的車？說說用途或預算';
  openSizeModal(Number(match[0]));
}
/* 尺寸區間是通用示意值（四個尺寸、身高 157–187cm），等接官方 Size Guide 再逐車系換。 */
const SIZE_RANGES = [['XS',157,169],['S',165,175],['M',171,181],['M/L',177,187]];
const TRACK_MIN = 150, TRACK_MAX = 195;     /* 圖表橫軸範圍，讓四條 bar 依身高錯開 */
const fmtHeight = cm => {
  if (sizeUnit === 'cm') return cm + ' cm';
  const inches = cm / 2.54, ft = Math.floor(inches / 12), inch = Math.round(inches - ft * 12);
  return inch === 12 ? (ft + 1) + "'0\"" : ft + "'" + inch + '"';
};
function renderSizeChart(height){
  const child = at(i).k === 'kids';
  const frame = child ? null : recommendedFrame(height);
  sizeSummary.innerHTML = child
    ? '你的身高是 <strong class="h">' + fmtHeight(height) + '</strong>。童車還要一起確認跨高、輪徑與騎乘經驗，建議到店實際試跨。'
    : '你的身高是 <strong class="h">' + fmtHeight(height) + '</strong>，建議先從 <strong>' + frame + '</strong> 尺寸試起。';
  sizeChart.innerHTML = child
    ? '<div class="size-row recommended"><b>建議</b><div class="size-range text">到門市確認輪徑與跨高</div></div>'
    : SIZE_RANGES.map(([label,min,max]) => {
        const l = (min - TRACK_MIN) / (TRACK_MAX - TRACK_MIN) * 100, w = (max - min) / (TRACK_MAX - TRACK_MIN) * 100;
        return '<div class="size-row ' + (label === frame ? 'recommended' : '') + '"><b>' + label + '</b>' +
          '<div class="size-track"><div class="size-range" style="--l:' + l.toFixed(1) + '%;--w:' + w.toFixed(1) + '%">' +
          '<span>' + fmtHeight(min) + '</span><i></i><span>' + fmtHeight(max) + '</span></div></div></div>';
      }).join('');
}
const parseHeight = text => { const m = text.match(/(1[2-9]\d|20\d|210)(?:\.\d+)?/); return m ? Number(m[0]) : null; };
function openSizeModal(height, copy){
  const changed = knownHeight !== null && knownHeight !== height && !sizeModal.hidden;
  knownHeight = height;
  clearClerkSequence(false);
  engage();
  sizeTitle.textContent = selectedProduct().name + '｜車架幾何';
  compareModal.hidden = true;
  if (picking) stopPicking(false);              /* 挑選托盤先收，清單保留 */
  sizeModal.hidden = false;
  renderSizeChart(height);
  const frame = at(i).k === 'kids' ? null : recommendedFrame(height);
  const line = copy || (changed
    ? '改成 ' + height + ' 公分的話，' + (frame ? '建議先從 ' + frame + ' 尺寸試起。' : '童車還是要到店確認跨高與輪徑。')
    : '依你目前輸入的身高，我把建議尺寸整理在上面了。實際還是要試騎，確認跨高和伸展感。');
  const run = clerkRun;
  clerkTimers.push(setTimeout(() => {
    if (run !== clerkRun) return;
    setClerkState('speaking'); showClerkCopy(line); playClerkSound();
  }, 420));
  clerkTimers.push(setTimeout(() => { if (run === clerkRun) setClerkState('idle'); }, 3200));
}
function closeSize(){
  sizeModal.hidden = true;
  sizeQuick.focus();
  /* 關掉尺寸表店員也要接一句，不能突然安靜 */
  const frame = knownHeight && at(i).k !== 'kids' ? recommendedFrame(knownHeight) : null;
  say((frame ? '好，' + frame + ' 尺寸先記著。' : '好，尺寸先記著。') + '\n想看別台直接點展台上的車，或跟我說平常怎麼騎，我幫你挑。', 4200);
}
sizeClose.onclick = closeSize;
sizeModal.onclick = event => { if (event.target === sizeModal) closeSize(); };
sizeUnits.onclick = event => {
  const button = event.target.closest('button[data-unit]');
  if (!button || button.dataset.unit === sizeUnit) return;
  sizeUnit = button.dataset.unit;
  sizeUnits.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  if (knownHeight) renderSizeChart(knownHeight);
};
accessorySkip.onclick = () => { accessoryPanel.hidden = true; clerkInput.focus(); };
accessoryPanel.querySelectorAll('.accessory-add').forEach(button => {
  button.onclick = () => {
    const added = button.classList.toggle('added');
    button.textContent = added ? '已加入清單' : '加入清單';
    button.setAttribute('aria-pressed', String(added));
  };
});
addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if (!compareModal.hidden) closeCompare();
  else if (!sizeModal.hidden) closeSize();
  else if (picking) stopPicking(false);
  else if (!accessoryPanel.hidden){ accessoryPanel.hidden = true; clerkInput.focus(); }
});
micBtn.onclick = () => {
  clearClerkSequence(); clerk.classList.add('engaged');
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition){
    showClerkCopy('目前這個瀏覽器無法使用語音輸入，你可以按左邊的鍵盤打字告訴我。');
    clerkTimers.push(setTimeout(() => clerkCopy.classList.remove('show'), 4500));
    return;
  }
  recognition = new Recognition();
  recognition.lang = 'zh-TW'; recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart = () => { setClerkState('listening'); showClerkCopy('我在聽，你可以直接說平常怎麼騎。'); playClerkSound('listening'); };
  recognition.onresult = event => respondToUser(event.results[0][0].transcript);
  recognition.onerror = () => { setClerkState('idle'); showClerkCopy('剛剛沒有聽清楚，可以再說一次，或改用打字。'); };
  recognition.onend = () => { if (orb.dataset.state === 'listening') setClerkState('idle'); };
  recognition.start();
};
micChoice.onclick = () => micBtn.onclick();

/* Safari 播得動 VP9 webm 但會丟掉 alpha，球就變成一塊灰白方塊；
   只在 Safari 留 HEVC alpha 的 .mov，其他瀏覽器把它拿掉，免得 Chrome 挑到沒有透明的那份。 */
(() => {
  const video = document.getElementById('orbVideo');
  const safari = /apple/i.test(navigator.vendor || '');
  if (!safari) video.querySelector('source[data-for="safari"]')?.remove();
  video.load();
})();
paint(0);
/* 中央不再放分類膠囊；停留片刻後，改由 AI 門市人員說明所在展區。 */
clerkForm.inert = true;
inputChoices.inert = true;
runClerkScript(at(i), 1200);
if (reduceMotion){
  const video = document.getElementById('orbVideo'); video.pause(); video.currentTime = 0;
}

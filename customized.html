/* 全站 header（首頁、產品頁共用）
   尺寸跟著視窗寬度等比縮放（以 1672 寬的設計稿為準，最小以 1200 計）。
   文字／圖示顏色用 --nav-ink，各頁自己決定（深色主視覺就設成白色）。 */
.site-nav{--hu:calc(max(100vw, 1200px) / 1672);position:absolute;z-index:30;left:0;right:0;top:0;height:calc(var(--hu) * 76);color:var(--nav-ink, #141A22)}
.site-nav .logo{position:absolute;left:calc(var(--hu) * 42);top:0;bottom:0;display:flex;align-items:center;color:inherit}
.site-nav .logo svg{display:block;height:calc(var(--hu) * 20);width:auto;color:inherit}
.site-nav .links{position:absolute;left:calc(var(--hu) * 232);top:0;bottom:0;display:flex;align-items:center;gap:calc(var(--hu) * 34);font-size:calc(var(--hu) * 16);line-height:1;font-weight:500}
.site-nav .links a{color:inherit;text-decoration:none;opacity:.92;transition:opacity .2s}
.site-nav .links a:hover{opacity:1}
/* 右側順序：購物車、會員、AI 助理（固定在最右邊） */
.site-nav .icons{position:absolute;right:calc(var(--hu) * 40);top:0;bottom:0;display:flex;align-items:center;gap:calc(var(--hu) * 34)}
.site-nav .icons a{position:relative;display:grid;place-items:center;color:inherit}
.site-nav .icons svg{display:block;width:calc(var(--hu) * 26);height:calc(var(--hu) * 26)}
.site-nav .orb-wrap{position:relative;display:grid;place-items:center}
.site-nav .orb-btn{position:relative;display:grid;place-items:center;width:calc(var(--hu) * 26);height:calc(var(--hu) * 26);transition:transform .2s}
.site-nav .orb-btn:hover{transform:scale(1.08)}

/* header 的顧問按鈕：白色圓底 + 藍色 V 標，外圈一條細藍光沿邊繞行（與首頁按鈕同一套 beam）。
   subnav 裡沒有 --hu，退回產品頁的 --u */
@property --beam-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
.orb-btn.vbtn{--bu:var(--hu,var(--u,1px));position:relative;isolation:isolate;display:grid;place-items:center;width:calc(var(--bu) * 36);height:calc(var(--bu) * 36);border-radius:50%;
  background:#fff;color:#1F4FE0;border:1px solid rgba(20,26,34,.12);box-shadow:0 2px 10px rgba(20,26,34,.12);transition:transform .2s,box-shadow .2s}
.orb-btn.vbtn:hover{transform:scale(1.06);box-shadow:0 3px 14px rgba(31,79,224,.22)}
.orb-btn.vbtn .vmark{position:relative;z-index:2;width:calc(var(--bu) * 13);height:calc(var(--bu) * 17);margin-top:1px}
.orb-btn.vbtn .beam-ring,.orb-btn.vbtn .beam-glow{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--beam-angle),transparent 0% 30%,rgba(79,141,255,.08) 45%,rgba(79,141,255,.35) 60%,rgba(120,180,255,.85) 70%,#BFE0FF 73%,rgba(120,180,255,.85) 76%,rgba(79,141,255,.35) 86%,rgba(79,141,255,.08) 100%);
  animation:beam-spin 4s linear infinite}
.orb-btn.vbtn .beam-ring{z-index:1;padding:1px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

:root{--fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:24px;--fs-2xl:28px;--fs-hero:56px}
.site-nav .links,.step,.view-tabs button,.panel .segmented button,.btn,.panel-column #next,.panel-column #back,.panel .text-button,.panel .pill-option,.panel .size-choice,.part-back,.text-input,select,.signature-tools select,.panel .signature-switch,.cart-actions .text-button{font-size:var(--fs-sm)}
.panel .panel-head p,.option-copy,.option-price,.panel .review-group p,.dialog-description,.help-list,.success-details,.toast,.empty-state,.cart-info h3{font-size:var(--fs-sm)}
.step span,.stage-name,.product-code,.crumb,.price-cluster small,.panel .paint-card small,.panel .field-head small,.panel .size-help,.input-label,.input-helper,.signature-tools label,.signature-label,.part-row-text small,.panel .review-group small,.panel .cost-row,.cart-info p,.error,.preview-footer p{font-size:var(--fs-xs)}
.panel .paint-card strong,.panel h3,.part-row-text strong,.panel .review-group h3,.panel .costs h3,.panel .parts-total h3,.panel .parts-total strong,.panel .cost-row.total,.cart-dialog .cost-row.total,.cart-info .money{font-size:var(--fs-md)}
.panel-column .price-number{font-size:var(--fs-lg)}
.panel .panel-head h2,.dialog-header h2{font-size:var(--fs-xl)}

/* Bottom breathing room under the workspace, all breakpoints. */
.page{padding-bottom:36px}

/* Flat preview carousel */
.stage.is-flat #flatPreview{position:absolute;inset:0;width:100%;height:100%;margin:0;transform:none}
.flat-viewer{position:relative;width:100%;height:100%;display:flex;flex-direction:column;outline:none;touch-action:pan-y}
.flat-viewer:focus-visible{outline:3px solid #64748b;outline-offset:-3px;border-radius:14px}
.flat-slide{flex:1;min-height:0;display:grid;place-items:center;padding:24px 72px 0}
.flat-slide .bike-art{width:100%;height:100%;max-height:100%;overflow:hidden}
@keyframes flat-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.flat-nav{position:absolute;top:50%;transform:translateY(-50%);background:#fff;z-index:2}
.flat-nav.prev{left:8px}.flat-nav.next{right:8px}
.flat-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 8px}
.flat-dots{display:flex;gap:12px}
.flat-dots button{width:8px;height:8px;border-radius:50%;background:#c4cbd3;padding:0;transition:background .2s,transform .2s}
.flat-dots button[aria-current]{background:var(--ink);transform:scale(1.15)}
.flat-dots button:before{content:'';position:absolute;inset:-10px}.flat-dots button{position:relative}
.flat-caption{font-size:var(--fs-xs);color:var(--ink-70)}
@media(max-width:800px){.flat-slide{padding:8px 52px 0}.flat-nav.prev{left:0}.flat-nav.next{right:0}}
/* ===== Control sizes & spacing — one scale for every button and group =====
   heights: --h-control 48 (buttons, option rows, size chips) · --h-icon 44 (round icon buttons) · 32 (inline info icon)
   gaps:    --gap-sm 8 · --gap-md 12 (between buttons / options / swatches) · --gap-lg 16 (text links) · --gap-xl 24 (tabs) */
:root{--h-control:48px;--h-icon:44px;--gap-sm:8px;--gap-md:12px;--gap-lg:16px;--gap-xl:24px;--pad-btn:24px}
.btn,.panel-column #next,.pick-body .btn,.saved-actions .btn,.fav-actions .btn,.dialog-actions .btn{height:var(--h-control);min-height:var(--h-control);padding:0 var(--pad-btn)}
.panel .size-choice,.size-choice,.finish-row{min-height:var(--h-control)}
.fav-toggle,.panel-column .fav-toggle,.icon-button,.share-close{width:var(--h-icon);height:var(--h-icon)}
.panel .color-swatch,.zone-section .color-swatch,.signature-color .color-swatch{width:34px;height:34px}
.dialog-actions,.saved-actions,.fav-actions,.head-tools,.panel .size-row,.size-row,.finish-list,.extra-list,.panel .paint-grid,.paint-grid,.option-cards,.panel .color-set,.zone-section .color-set,.pick-grid .pick-body .btn+.btn{gap:var(--gap-md)}
.panel-column .actions{gap:var(--gap-lg)}
.cart-actions{gap:var(--gap-lg)}
.panel .segmented,.pick-tabs{gap:var(--gap-xl)}
@media(max-width:800px){.panel-column #next{padding:0 14px}.panel-column .actions{gap:var(--gap-sm)}}

/* One spacing system for the fixed heading, options and purchase bar. */
.panel-column{--gap-md:10px}

.panel-header .segmented{margin-bottom:0}

// 3D preview (three.js). A procedural stand-in road bike: frame tubes are grouped into the same paint zones as the
// configurator (upper / lower / fork / logo), so colours, finishes, gradients and the signature map 1:1.
// Replace with GIANT's own DEFY model (glTF with the same zone names) when it is available.
function createViewer(host){
  const T=THREE,stage=host.closest('.stage');
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=T.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.VSMShadowMap;
  renderer.domElement.className='bike-canvas';renderer.domElement.setAttribute('aria-label','DEFY 3D 預覽，拖曳可旋轉');renderer.domElement.setAttribute('role','img');
  host.replaceChildren(renderer.domElement);
  const scene=new T.Scene(),camera=new T.PerspectiveCamera(28,1,0.1,100);
  scene.add(new T.HemisphereLight(0xffffff,0x6f7680,0.55));
  const key=new T.DirectionalLight(0xffffff,0.7);key.position.set(4,6,6);scene.add(key);
  // Overhead light that only exists to cast a soft shadow onto an invisible floor (fixed in the world, so the shadow changes as the bike turns).
  const sun=new T.DirectionalLight(0xffffff,0.3);sun.position.set(1.2,9,2.2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  Object.assign(sun.shadow.camera,{left:-4.5,right:4.5,top:4.5,bottom:-4.5,near:2,far:20});sun.shadow.bias=-0.0006;sun.shadow.radius=14;scene.add(sun);
  const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.ShadowMaterial({opacity:.16}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.645;floor.receiveShadow=true;scene.add(floor);
  const rim=new T.DirectionalLight(0xffffff,0.6);rim.position.set(-5,3,-6);scene.add(rim);
  const fill=new T.DirectionalLight(0xffffff,0.35);fill.position.set(0,-3,4);scene.add(fill);

  const lin=c=>new T.Color(c).convertSRGBToLinear();
  // SVG side-view coordinates (the 2D thumbnails) → 3D metres-ish; wheels sit on y=0.
  const P=(x,y,z=0)=>new T.Vector3((x-338)/100,(292-y)/100,z);
  const bike=new T.Group(),root=new T.Group();root.add(bike);scene.add(root);bike.position.set(0,-0.56,0);

  const zoneMat={upper:new T.MeshPhysicalMaterial(),lower:new T.MeshPhysicalMaterial(),fork:new T.MeshPhysicalMaterial()};
  const dark=new T.MeshStandardMaterial({color:lin('#22282c'),roughness:.55,metalness:.2});
  const black=new T.MeshStandardMaterial({color:lin('#15191c'),roughness:.9});
  const alloy=new T.MeshStandardMaterial({color:lin('#4a5257'),roughness:.4,metalness:.6});
  const tapeMat=new T.MeshStandardMaterial({roughness:.8});
  const tube=(pts,r,mat,seg=24)=>{const m=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),seg,r,14,false),mat);bike.add(m);return m};
  const cap=(p,r,mat)=>{const m=new T.Mesh(new T.SphereGeometry(r,16,12),mat);m.position.copy(p);bike.add(m)};

  // key points
  const R=P(125,292),F=P(550,292),BB=P(277,286),ST=P(226,123),HT=P(444,118),HB=P(458,162),TT=P(447,132),DT=P(454,150);
  // frame — upper zone: top tube + seat stays; lower zone: down tube, seat tube, head tube, chain stays; fork zone: fork
  tube([ST,TT],.07,zoneMat.upper);
  for(const z of [-.09,.09]){tube([P(226,140,z*.4),P(175,215,z*.8),P(125,292,z)],.032,zoneMat.upper);tube([P(277,286,z*.4),P(200,290,z*.85),P(125,292,z)],.036,zoneMat.lower)}
  tube([DT,BB],.1,zoneMat.lower);tube([BB,ST],.08,zoneMat.lower);tube([HT,HB],.09,zoneMat.lower);
  cap(BB,.11,zoneMat.lower);cap(ST,.08,zoneMat.upper);
  for(const z of [-.075,.075])tube([P(458,162,z*.6),P(472,200,z),P(520,255,z),P(550,292,z)],.042,zoneMat.fork);
  // cockpit
  tube([P(226,123),P(214,76)],.035,dark);
  const saddle=new T.Mesh(new T.BoxGeometry(.7,.06,.16),black);saddle.position.copy(P(214,70));bike.add(saddle);
  tube([P(444,112),P(492,98)],.04,dark);
  const bar=new T.Mesh(new T.CylinderGeometry(.025,.025,.42,12),dark);bar.rotation.x=Math.PI/2;bar.position.copy(P(492,98));bike.add(bar);
  const tapeTubes=[];for(const z of [-.21,.21]){tube([P(492,98,z*.95),P(512,98,z),P(518,112,z)],.025,dark);tapeTubes.push(tube([P(518,112,z),P(514,126,z),P(498,134,z),P(484,131,z)],.028,tapeMat))}
  // drivetrain
  const ring=new T.Mesh(new T.CylinderGeometry(.3,.3,.012,40),alloy);ring.rotation.x=Math.PI/2;ring.position.copy(BB).setZ(.14);bike.add(ring);
  const cog=new T.Mesh(new T.CylinderGeometry(.13,.13,.06,32),alloy);cog.rotation.x=Math.PI/2;cog.position.copy(R).setZ(.12);bike.add(cog);
  tube([P(277,256,.14),P(125,276,.12)],.008,dark,8);tube([P(277,316,.14),P(125,308,.12)],.008,dark,8);
  for(const [z,dir] of [[.17,1],[-.17,-1]]){const arm=tube([P(277,286,z),P(277+dir*30,286+dir*25,z)],.022,dark,4);const pedal=new T.Mesh(new T.BoxGeometry(.18,.03,.1),dark);pedal.position.copy(P(277+dir*30,286+dir*25,z+(z>0?.06:-.06)));bike.add(pedal)}
  // wheels
  for(const c of [R,F]){
    const tire=new T.Mesh(new T.TorusGeometry(1.03,.055,14,64),black);tire.position.copy(c);bike.add(tire);
    const rimM=new T.Mesh(new T.TorusGeometry(.96,.035,10,64),dark);rimM.position.copy(c);bike.add(rimM);
    const hub=new T.Mesh(new T.CylinderGeometry(.05,.05,.2,16),alloy);hub.rotation.x=Math.PI/2;hub.position.copy(c);bike.add(hub);
    const pts=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2,z=i%2?.06:-.06;pts.push(c.x,c.y,z,c.x+Math.cos(a)*.94,c.y+Math.sin(a)*.94,0)}
    const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pts,3));bike.add(new T.LineSegments(g,new T.LineBasicMaterial({color:0x9aa2a6})));
  }
  // contact shadows: a tight dark core where each tyre meets the floor, plus a very faint ambient pool under the bike
  function blob(w,d,alpha,x){const c=document.createElement('canvas');c.width=128;c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,`rgba(20,26,34,${alpha})`);r.addColorStop(.55,`rgba(20,26,34,${alpha*.35})`);r.addColorStop(1,'rgba(20,26,34,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
    const m=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,-1.082,0);m.renderOrder=-1;bike.add(m)}
  blob(.8,.3,.7,R.x);blob(.8,.3,.7,F.x);blob(6.6,1.5,.07,0);

  bike.traverse(o=>{if(o.isMesh&&!o.material.transparent)o.castShadow=true});
  // decals: text drawn to canvas, laid flat against a tube, one per side
  function decal(a,b,offset,len,h){const holder=new T.Group(),mid=a.clone().lerp(b,.5);holder.position.copy(mid);holder.rotation.z=Math.atan2(b.y-a.y,b.x-a.x);bike.add(holder);
    const cv=document.createElement('canvas');cv.width=1024;cv.height=128;const tex=new T.CanvasTexture(cv);tex.encoding=T.sRGBEncoding;tex.anisotropy=4;
    const mat=new T.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false});const sides={};
    for(const [side,z,flip] of [['left',offset,false],['right',-offset,true]]){const m=new T.Mesh(new T.PlaneGeometry(len,h),mat);m.position.z=z;if(flip)m.rotation.y=Math.PI;holder.add(m);sides[side]=m}
    return {sides,draw(text,color,font){const x=cv.getContext('2d');x.clearRect(0,0,1024,128);x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.font=font;x.fillText(text,512,68);tex.needsUpdate=true}}}
  const logo=decal(BB,DT,.102,1.6,.2);
  const sign=decal(ST,TT,.072,1.2,.15);

  const gradTex={};
  function gradientMap(g){if(gradTex[g.id])return gradTex[g.id];const cv=document.createElement('canvas');cv.width=256;cv.height=4;const x=cv.getContext('2d'),l=x.createLinearGradient(0,0,256,0);l.addColorStop(0,g.from);l.addColorStop(1,g.to);x.fillStyle=l;x.fillRect(0,0,256,4);const t=new T.CanvasTexture(cv);t.encoding=T.sRGBEncoding;return gradTex[g.id]=t}
  function paint(mat,value,finish){const g=gradient(value);mat.map=g?gradientMap(g):null;mat.color.copy(g?new T.Color(0xffffff):lin(value));const glossy=finish==='亮面';mat.roughness=glossy?.18:.62;mat.clearcoat=glossy?1:0;mat.clearcoatRoughness=.08;mat.metalness=.05;mat.needsUpdate=true}

  // camera: framing presets, drag to rotate, wheel / button to zoom
  const view={yaw:.42,pitch:.08,vyaw:0,dist:1,distTarget:1,target:new T.Vector3(),targetGoal:new T.Vector3()};
  let base=9,dirty=true,drag=null;
  function fit(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const t=Math.tan(camera.fov*Math.PI/360)*2;base=Math.max(3.9/t,7.0/(t*camera.aspect))*1.05;dirty=true}
  new ResizeObserver(fit).observe(host);fit();
  const el=renderer.domElement;el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};view.vyaw=0;el.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
  el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};view.yaw+=dx*.008;view.vyaw=dx*.008;view.pitch=Math.max(-.25,Math.min(.45,view.pitch+dy*.004));dirty=true});
  const end=()=>{drag=null;stage.classList.remove('dragging')};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();view.distTarget=Math.max(.45,Math.min(1.25,view.distTarget*(e.deltaY>0?1.08:.92)));dirty=true},{passive:false});
  function frame(){requestAnimationFrame(frame);
    if(!drag&&Math.abs(view.vyaw)>.0002){view.yaw+=view.vyaw;view.vyaw*=.93;dirty=true}
    if(Math.abs(view.dist-view.distTarget)>.0005||view.target.distanceTo(view.targetGoal)>.0005){view.dist+=(view.distTarget-view.dist)*.12;view.target.lerp(view.targetGoal,.12);dirty=true}
    if(!dirty)return;dirty=false;root.rotation.set(0,view.yaw,0);
    const d=base*view.dist;camera.position.set(view.target.x,view.target.y+Math.sin(view.pitch)*d,view.target.z+Math.cos(view.pitch)*d);camera.lookAt(view.target);renderer.render(scene,camera)}
  requestAnimationFrame(frame);

  return {
    snapshot(){renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png')},
    update(c){const p=selectedPaint(c),custom=c.mode==='custom',fin=k=>custom?c.custom.finishes[k]:'霧面';
      paint(zoneMat.upper,custom?c.custom.upper:p.color,fin('upper'));paint(zoneMat.lower,custom?c.custom.lower:p.color,fin('lower'));paint(zoneMat.fork,custom?c.custom.lower:p.color,fin('lower'));
      tapeMat.color.copy(lin(c.parts.tape?'#657f93':'#282e32'));
      logo.draw('GIANT',custom?c.custom.logo:'#ffffff','italic 900 104px Arial, sans-serif');
      const s=c.signature,show=s.enabled&&s.text;sign.draw(show?s.text:'',s.color,`${s.font==='script'?'italic 400':'600'} 100px ${s.font==='script'?'cursive':'Arial, sans-serif'}`);
      sign.sides.left.visible=show&&s.position!=='right';sign.sides.right.visible=show&&s.position!=='left';dirty=true},
    // 全車 / 車架細節 presets and the zoom button drive the camera instead of CSS transforms
    setView(v){view.targetGoal.set(v==='detail'?-.3:0,v==='detail'?.35:0,0);view.distTarget=v==='detail'?.55:1;dirty=true},
    setZoom(on){view.distTarget=on?Math.min(view.distTarget,.72):(view.targetGoal.x?.55:1);dirty=true}
  };
}
// Fall back to the flat SVG preview when three.js can't load (offline) or WebGL is unavailable.
let viewer=null;
try{if(window.THREE&&document.createElement('canvas').getContext('webgl')){viewer=createViewer($('#bikePreview'))}}catch(e){console.warn('3D preview unavailable',e);viewer=null}
// Flat preview (basic models): a Gogoro-style carousel. Until product photos exist, each "angle" is a framed crop of the drawing.
const FLAT_VIEWS=[{id:'side',name:'全車側面',vb:'0 0 690 445'},{id:'frame',name:'車架細節',vb:'165 92 340 220'},{id:'cockpit',name:'座艙與車把',vb:'330 40 280 180'},{id:'drive',name:'傳動系統',vb:'60 200 340 175'},{id:'rear',name:'後輪與飛輪',vb:'15 175 230 235'},{id:'front',name:'前輪',vb:'440 182 220 220'}];
// Volvo-style focus: the step or part you are working on decides where the camera points.
const PART_VIEW={bar:'cockpit',tape:'cockpit',stem:'cockpit',headset:'cockpit',cassette:'rear',chain:'drive',chainring:'drive',bb:'drive',decals:'front'};
const viewIndex=id=>Math.max(0,FLAT_VIEWS.findIndex(v=>v.id===id));
function contextView(){if(page==='paint')return paintTab==='signature'?'frame':'side';if(page==='parts')return partDetail?PART_VIEW[partDetail]:partsTab==='size'?'side':null;return 'side'}
let flatIdx=0,flatVB=FLAT_VIEWS[0].vb,flatAnim=0,flatContext='',hoverPart=null;
function renderFlat(){const v=FLAT_VIEWS[flatIdx],art=bike(config).replace('viewBox="0 0 690 445"',`viewBox="${flatVB}"`);
  $('#flatPreview').innerHTML=`<div class="flat-viewer" tabindex="0" role="region" aria-roledescription="輪播" aria-label="車款預覽：${v.name}，第 ${flatIdx+1} 張，共 ${FLAT_VIEWS.length} 張"><div class="flat-slide">${art}</div><button type="button" class="fav-toggle flat-nav prev" data-flat-step="-1" aria-label="上一個角度">${CHEV_L}</button><button type="button" class="fav-toggle flat-nav next" data-flat-step="1" aria-label="下一個角度">${CHEV_R}</button><div class="flat-foot"><div class="flat-dots">${FLAT_VIEWS.map((x,i)=>`<button type="button" data-flat-go="${i}" aria-label="${x.name}" ${i===flatIdx?'aria-current="true"':''}></button>`).join('')}</div><span class="flat-caption">${v.name}</span></div></div>`}
// Pan/zoom the drawing to the target framing instead of cutting to it.
function flatGo(i,focus=true){flatIdx=(i+FLAT_VIEWS.length)%FLAT_VIEWS.length;const from=flatVB.split(' ').map(Number),to=FLAT_VIEWS[flatIdx].vb.split(' ').map(Number);cancelAnimationFrame(flatAnim);renderFlat();if(focus)$('.flat-viewer').focus({preventScroll:true});
  const t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:650;
  const step=now=>{const k=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-k,4);flatVB=from.map((v,n)=>(v+(to[n]-v)*e).toFixed(1)).join(' ');$('.flat-slide svg')?.setAttribute('viewBox',flatVB);if(k<1)flatAnim=requestAnimationFrame(step)};flatAnim=requestAnimationFrame(step)}
function focusFlat(id){if(!id)return;const i=viewIndex(id);if(i!==flatIdx||flatVB!==FLAT_VIEWS[i].vb)flatGo(i,false)}
function paintPreview(){const three=uses3d(config);$('#bikePreview').hidden=!three;$('#flatPreview').hidden=three;$('#stage').classList.toggle('is-3d',three);$('#stage').classList.toggle('is-flat',!three);if(three){viewer.update(config);return}const ctx=[page,paintTab,partsTab,partDetail].join('|');if(ctx!==flatContext){flatContext=ctx;hoverPart=null;const v=contextView();if(v&&FLAT_VIEWS[flatIdx].id!==v){focusFlat(v);return}}renderFlat()}
// Sharing: the link carries the whole configuration in its hash, so opening it restores the design.
const encodeDesign=c=>btoa(unescape(encodeURIComponent(JSON.stringify(c))));
function shareLink(){return location.href.split('#')[0]+'#design='+encodeDesign(config)}
function loadSharedDesign(){const m=location.hash.match(/^#design=(.+)$/);if(!m)return;try{const d=JSON.parse(decodeURIComponent(escape(atob(m[1])))),base=initialConfig();config={...base,...d,custom:{...base.custom,...d.custom,finishes:{...base.custom.finishes,...(d.custom||{}).finishes}},signature:{...base.signature,...d.signature},parts:{...base.parts,...d.parts},extras:{...base.extras,...d.extras}};paintTab=config.mode;page='review'}catch(e){console.warn('Shared design could not be read',e)}}
// Image: the current 3D view (or the flat drawing when 3D is unavailable) on a white card.
async function designImage(background){const W=1200,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');if(background){x.fillStyle=background;x.fillRect(0,0,W,H)}
  const src=uses3d(config)?viewer.snapshot():URL.createObjectURL(new Blob([bike(config).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="890" ')],{type:'image/svg+xml'}));
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});const k=Math.min(W*.9/img.width,H*.8/img.height);x.drawImage(img,(W-img.width*k)/2,(H-img.height*k)/2,img.width*k,img.height*k);
  x.fillStyle='#7A8492';x.font='600 22px Inter, sans-serif';x.fillText(modelTitle(config),48,H-48);return cv.toDataURL('image/png')}
async function openShare(){const c=config;$('#shareSub').textContent=modelTitle(c);$('#shareSummary').innerHTML=[['塗裝',paintName(c)],['尺寸',c.size],['總價',money(total(c))]].map(([k,v])=>`<div><dt>${k}</dt><dd>${escapeHTML(v)}</dd></div>`).join('');$('#shareImg').removeAttribute('src');openDialog('#shareDialog');try{$('#shareImg').src=await designImage()}catch(e){console.warn(e)}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}}
$('#shareCopy').addEventListener('click',async()=>{const ok=await copyText(shareLink()),label=$('#shareCopy span');label.textContent=ok?'已複製連結':'無法複製，請稍後再試';clearTimeout(label.timer);label.timer=setTimeout(()=>label.textContent='複製連結',2400)});
$('#shareImage').addEventListener('click',async()=>{const a=document.createElement('a');a.href=await designImage('#fff');a.download=`${modelOf(config).name}-我的設計.png`;document.body.append(a);a.click();a.remove()});
loadSharedDesign();
render();
applyRoute(location.hash);
</script>

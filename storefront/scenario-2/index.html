/* 全站 header（首頁、產品頁共用）
   尺寸跟著視窗寬度等比縮放（以 1672 寬的設計稿為準，最小以 1200 計）。
   文字／圖示顏色用 --nav-ink，各頁自己決定（深色主視覺就設成白色）。 */
.site-nav{--hu:calc(max(100vw, 1200px) / 1672);position:absolute;z-index:30;left:0;right:0;top:0;height:calc(var(--hu) * 76);color:var(--nav-ink, #141A22)}
.site-nav .logo{position:absolute;left:calc(var(--hu) * 42);top:0;bottom:0;display:flex;align-items:center;color:inherit}
.site-nav .logo svg{display:block;height:calc(var(--hu) * 20);width:auto;color:inherit}
.site-nav .links{position:absolute;left:calc(var(--hu) * 232);top:0;bottom:0;display:flex;align-items:center;gap:calc(var(--hu) * 34);font-size:calc(var(--hu) * 16);line-height:1;font-weight:500}
.site-nav .links a{color:inherit;text-decoration:none;opacity:.92;transition:opacity .2s}
.site-nav .links a:hover{opacity:1}
/* 右側順序：購物車、會員、AI 助理（固定在最右邊） */
.site-nav .icons{position:absolute;right:calc(var(--hu) * 40);top:0;bottom:0;display:flex;align-items:center;gap:calc(var(--hu) * 34)}
.site-nav .icons a{position:relative;display:grid;place-items:center;color:inherit}
.site-nav .icons svg{display:block;width:calc(var(--hu) * 26);height:calc(var(--hu) * 26)}
.site-nav .orb-wrap{position:relative;display:grid;place-items:center}
.site-nav .orb-btn{position:relative;display:grid;place-items:center;width:calc(var(--hu) * 26);height:calc(var(--hu) * 26);transition:transform .2s}
.site-nav .orb-btn:hover{transform:scale(1.08)}

/* header 的顧問按鈕：白色圓底 + 藍色 V 標，外圈一條細藍光沿邊繞行（與首頁按鈕同一套 beam）。
   subnav 裡沒有 --hu，退回產品頁的 --u */
@property --beam-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
.orb-btn.vbtn{--bu:var(--hu,var(--u,1px));position:relative;isolation:isolate;display:grid;place-items:center;width:calc(var(--bu) * 36);height:calc(var(--bu) * 36);border-radius:50%;
  background:#fff;color:#1F4FE0;border:1px solid rgba(20,26,34,.12);box-shadow:0 2px 10px rgba(20,26,34,.12);transition:transform .2s,box-shadow .2s}
.orb-btn.vbtn:hover{transform:scale(1.06);box-shadow:0 3px 14px rgba(31,79,224,.22)}
.orb-btn.vbtn .vmark{position:relative;z-index:2;width:calc(var(--bu) * 13);height:calc(var(--bu) * 17);margin-top:1px}
.orb-btn.vbtn .beam-ring,.orb-btn.vbtn .beam-glow{position:absolute;inset:-1px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--beam-angle),transparent 0% 30%,rgba(79,141,255,.08) 45%,rgba(79,141,255,.35) 60%,rgba(120,180,255,.85) 70%,#BFE0FF 73%,rgba(120,180,255,.85) 76%,rgba(79,141,255,.35) 86%,rgba(79,141,255,.08) 100%);
  animation:beam-spin 4s linear infinite}
.orb-btn.vbtn .beam-ring{z-index:1;padding:1px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.orb-btn.vbtn .beam-glow{z-index:0;inset:-3px;filter:blur(4px);opacity:.22}
@keyframes beam-spin{to{--beam-angle:360deg}}
@media (prefers-reduced-motion:reduce){.orb-btn.vbtn .beam-ring,.orb-btn.vbtn .beam-glow{animation:none}}

/* 選車顧問（首頁、產品頁共用）
   需要頁面提供色彩變數：--ink --ink-70 --ink-50 --line --navy --ease */

/* orb 下方的主動提示卡 */
.orb-callout{position:absolute;isolation:isolate;z-index:60;top:calc(100% + 14px);right:-12px;width:300px;padding:16px 18px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(79,141,255,.18),0 0 18px rgba(79,141,255,.34),0 0 40px rgba(79,141,255,.22),0 18px 44px rgba(20,26,34,.18);text-align:left;opacity:0;transform:translateY(-6px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.orb-callout.on{opacity:1;transform:none}
.orb-callout[hidden]{display:none}
.orb-callout .tip{position:absolute;z-index:3;right:22px;top:-6px;width:11px;height:11px;transform:rotate(45deg);background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.orb-callout p{font-size:13.5px;line-height:1.75;color:var(--ink-70)}
.orb-callout b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
/* 提示框外框跑一條藍光（與 header 顧問按鈕同一套 beam） */
.orb-callout::after{content:"";position:absolute;z-index:1;inset:-1px;padding:1px;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from var(--beam-angle),transparent 0% 30%,rgba(79,141,255,.08) 45%,rgba(79,141,255,.35) 60%,rgba(120,180,255,.85) 70%,#BFE0FF 73%,rgba(120,180,255,.85) 76%,rgba(79,141,255,.35) 86%,rgba(79,141,255,.08) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:beam-spin 4s linear infinite}
.orb-callout p,.orb-callout .acts{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.orb-callout::after{animation:none}}
/* 「好，聊聊看」放右邊 */
.orb-callout .acts{display:flex;gap:8px;margin-top:12px}
.orb-callout .yes{order:2}
.orb-callout .no{order:1;margin-right:auto}
.orb-callout button{height:34px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:700}
.orb-callout .yes{background:var(--navy);color:#fff}
.orb-callout .no{border:1px solid #C5CCD5;color:var(--ink-70)}

/* Genie 縮放動畫層、orb 上「有對話」的提示點 */
.genie{position:fixed;inset:0;z-index:67;pointer-events:none}
.genie-strip{position:absolute;overflow:hidden;transform-origin:50% 50%;will-change:transform}
.orb-btn.has-chat::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:#1F4FE0;border:2px solid #fff;animation:amIn .3s var(--ease) both}

/* 對話框 */
.advisor{position:fixed;z-index:66;right:24px;top:80px;width:400px;height:calc(100vh - 104px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 28px 70px rgba(20,26,34,.2);overflow:hidden;opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.advisor.on{opacity:1;transform:none}
.advisor[hidden]{display:none}
.adv-hd{flex:none;display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;border-bottom:1px solid var(--line)}
.adv-av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#EEF3FF;color:#1F4FE0}
.adv-av svg{width:16px;height:20px;margin-top:2px}
.adv-who{flex:1;min-width:0}
.adv-who b{display:block;font-size:15px}
.adv-who small{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;color:var(--ink-50)}
.adv-who i{width:7px;height:7px;border-radius:50%;background:#22A55B}
.adv-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-70)}
.adv-x:hover{background:#EEF1F4;color:var(--ink)}

/* Stable stage geometry before and after asynchronous image decoding. */
.filter-garage.game-garage .garage-hero{display:flex;align-items:center;justify-content:center;position:relative;height:100%;min-height:0;padding:0}
.filter-garage.game-garage .garage-bike-display{position:relative;display:block;width:76%;max-width:620px;height:100%;min-height:0;max-height:100%;margin:0 auto}
.filter-garage.game-garage .garage-bike-display>img,.filter-garage.game-garage .garage-bike-display>canvas{position:absolute;inset:0 0 auto;width:100%;height:calc(100% - 76px);max-width:100%;max-height:none;object-fit:contain;object-position:center bottom;transform:translateY(30px);margin:0;animation:none}
.filter-garage.game-garage .garage-bike-caption{position:absolute;inset:auto 0 0;width:100%;height:36px;margin:0;text-align:center;line-height:36px;transform:none}
.filter-garage.game-garage .garage-card canvas{display:block;width:100%;height:72px;object-fit:contain;flex-shrink:0}
.filter-garage.game-garage .garage-bike-display>img,.filter-garage.game-garage .garage-bike-display>canvas{transform:translateY(60px)}
.game-garage .game-terrain{flex-shrink:0;padding:12px 0 0}
.game-garage .game-terrain h3{font-size:14px;margin:0 0 6px;color:#141a22}
.game-garage .game-terrain p{font-size:13px;line-height:1.65;color:#4a5563;margin:0}
/* 選車卡：車名與價格貼近；容器不留內距，卡片靠底與右側面板下緣切齊 */
/* 選車頁背景：車身與背景的平均明度差夠（138 對 70），吃掉車子的是背景的碎紋理
   （明度標準差 59、相鄰像素反差 12.7）。所以壓紋理而不是壓亮度：
   淺模糊收掉細節、中央光池把車子放進亮區、落影讓去背車圖離開地面。
   只限選車頁（body.lineup），入口頁的主視覺不受影響。 */
body.lineup #scene{filter:blur(2px);transform:scale(1.03)}
body.lineup #scene::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(30% 20% at 40% 55%,#f4f8fbd9 0%,#f4f8fb96 25%,#f4f8fb26 70%,transparent 100%)}
body.lineup .garage-bike-display>canvas,body.lineup .garage-bike-display>img{filter:drop-shadow(0 18px 26px #2a3a4a4d)}
/* 主打車圖縮小：舞台框原本是欄寬 76%、上限 620px，車圖受寬度限制，改這兩個值就能調大小 */
.filter-garage.game-garage .garage-bike-display{width:64%;max-width:520px}
/* 車圖下的接地陰影。原本只有 canvas 的 drop-shadow，那是整台車的剪影往下偏移，
   在淡色光池上幾乎看不出來，輪子還是像浮著。改成畫一個橢圓：
   兩個輪子的接地暗點（寬度 17% 與 83%）＋整體淡影。
   canvas 是 height:calc(100% - 76px) + translateY(40px) + object-position:50% 100%（靠下對齊），
   所以車身底緣固定貼在 canvas 盒子的下緣，也就是距容器頂端 calc(100% - 76px + 40px)。
   去背圖底下還留約 4% 的透明邊（量到 9～13px），再往上扣 11px 就是真正的著地線。
   橢圓高 36px，位置用 calc(100% - 110px) 由下緣往回推（依實際畫面微調過）。
   用 px 從下緣回推、不用百分比，視窗高度變了才不會跑掉（百分比那版在 1000x700 就偏了）。 */
.filter-garage.game-garage .garage-bike-display{isolation:isolate}
.filter-garage.game-garage .garage-bike-display::after{content:'';position:absolute;z-index:-1;
 pointer-events:none;left:50%;transform:translateX(-50%);top:calc(100% - 110px);width:96%;height:36px;
 background:radial-gradient(ellipse 20% 52% at 18% 52%,#16212cb3 0%,#16212c47 48%,transparent 72%),
  radial-gradient(ellipse 20% 52% at 82% 52%,#16212cb3 0%,#16212c47 48%,transparent 72%),
  radial-gradient(ellipse at 50% 50%,#16212c52 0%,#16212c2b 42%,transparent 74%);
 filter:blur(7px)}
/* 車圖垂直位移：原本 60px，改成 40px。img 與 canvas 都要，file:// 下去背失敗時留的是 img */
.filter-garage.game-garage .garage-bike-display>canvas,
.filter-garage.game-garage .garage-bike-display>img{transform:translateY(40px)}
/* 騎乘體驗鈕移到舞台底部：車圖與 rail 之間只有 32px，按鈕 49px 放不下，
   所以貼齊舞台底緣、距 rail 16px（與格線間距一致），上緣自然壓在車圖下半。 */
.game-garage .garage-left{position:relative}
.game-garage .garage-left>.garage-start{position:absolute;top:auto;right:auto;left:50%;bottom:0!important;transform:translateX(-50%);align-self:flex-end;width:174px;height:48px;min-height:0;max-height:48px;margin:0!important;z-index:4}
/* 騎乘體驗鈕改用全站 .primary 的實心品牌藍（同報告頁結帳鈕），移除漸層、外框、光暈與掃光 */
.game-garage .garage-left>.garage-start{padding:0 28px;background:#06038d!important;border:0!important;border-radius:6px;box-shadow:none!important;filter:none!important;font-size:14px;font-weight:600;color:#fff}
.game-garage .garage-left>.garage-start:hover{background:#1511ac!important;box-shadow:none!important;filter:none!important}
.game-garage .garage-left>.garage-start:before{display:none!important}
/* 選車卡移除所有陰影（含 hover 光暈與選取光環），選取狀態只靠 2px 品牌藍外框 */
.game-garage .garage-cards .garage-card,
.game-garage .garage-cards .garage-card:hover,
.game-garage .garage-cards .garage-card:focus-visible,
.game-garage .garage-cards .garage-card.active{box-shadow:none!important;filter:none!important}
/* 右側面板的 AI 選車分析：文字樣式沿用同層的適用地形，維持面板一致 */
.game-garage .game-ai{flex-shrink:0;padding:12px 0 0}
.game-garage .game-ai h3{font-size:14px;margin:0 0 6px;color:#141a22}
.game-garage .game-ai p{font-size:13px;line-height:1.65;color:#4a5563;margin:0}
.game-garage .game-ai p+p{margin-top:8px;color:#141a22}
/* 收藏鈕：放在面板標題右側，跟車名同一行。顧問收合時標題仍在，所以一直看得到 */
.game-garage .game-performance-heading{display:grid;grid-template-columns:minmax(0,1fr) auto;
 grid-template-areas:"label save" "name save";align-items:center;column-gap:12px}
.game-garage .game-performance-heading span{grid-area:label}
.game-garage .game-performance-heading h2{grid-area:name}
/* 樣式對齊 product.html 的 .btn-fav：方形描邊愛心，收藏後轉紅並填滿 */
.game-garage .garage-save{grid-area:save;justify-self:end;width:40px;height:40px;padding:0;
 border-radius:6px;border:1px solid #B8C0CA;background:rgba(255,255,255,.5);
 display:grid;place-items:center;color:#4a5563;cursor:pointer;
 transition:color .2s,border-color .2s}
.game-garage .garage-save svg{width:18px;height:18px}
.game-garage .garage-save:hover{border-color:#8f99a5}
.game-garage .garage-save[aria-pressed="true"]{color:#E0344B;border-color:#E0344B}
.game-garage .garage-save[aria-pressed="true"] path{fill:currentColor}
/* 右側面板：標題與問答列固定，中間內容超出高度才捲動 */
.game-garage .garage-details{overflow:hidden}
.game-garage .garage-details>.game-performance-heading{flex-shrink:0}
.game-garage .garage-details-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
/* 只問這一台車的問答列 */
/* 問答列只在顧問面板裡出現，平常收在車款面板裡不顯示 */
.game-garage .garage-details>.game-ask{display:none}
.game-garage .advisor>.game-ask{flex:1;min-height:0;display:flex;flex-direction:column;
 justify-content:flex-end;gap:8px}
.game-garage .game-ask-reply{margin:0;font-size:13px;line-height:1.6;color:#141a22;background:#f2f4fb;border-radius:8px;padding:10px 12px}
.game-garage .advisor>.game-ask>.game-ask-reply{overflow-y:auto}
.game-garage .game-ask-chips{display:flex;flex-wrap:wrap;gap:6px}
.game-garage .game-ask-chips button{padding:6px 12px;border-radius:999px;border:1px solid #C5CCD5;background:#fff;font:inherit;font-size:13px;line-height:1.4;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.game-garage .game-ask-chips button:hover{border-color:var(--ink)}
/* 輸入列比照選車顧問的 .adv-in：藥丸外框、無框輸入、圓形深藍送出鈕 */
#garage-ask-form{flex:none;display:flex;align-items:center;gap:2px;padding:5px 5px 5px 14px;border:1px solid #C5CCD5;border-radius:999px;background:#fff;transition:border-color .2s}
#garage-ask-form:focus-within{border-color:var(--ink)}
#garage-ask-input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:0 4px}
#garage-ask-input::placeholder{color:#9AA4B0}
#garage-ask-form button{flex:none;width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;cursor:pointer;transition:background .2s}
#garage-ask-form button svg{width:17px;height:17px}
#garage-ask-form button:hover{background:var(--ink)}
/* 右欄改成上下兩塊獨立面板：上面是車款資訊，下面是選車顧問，各自有底、中間留空隙 */
.game-garage .garage-side{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:12px;min-height:0}
/* 切換顧問時整頁會重繪，面板是全新元素，transition 沒有前一個狀態可補間，所以用 keyframes。
   高度以 flex-basis 表示，內容交給 overflow 裁切，看起來就是往上收。
   --garage-collapsed 由 JS 依實際標題高度寫入，不寫死。 */
.game-garage .garage-side>.garage-details{flex:0 0 100%;min-height:0;overflow:hidden}
/* 顧問開啟時上面這塊收到一半，兩塊各佔一半（扣掉 12px 間距）。
   動畫只在「開啟的那一次」播：換車會整頁重繪，若綁在 advisor-open 上每次都會重彈一下。 */
.game-garage .garage-side.advisor-open>.garage-details{flex:0 0 calc(50% - 6px)}
.game-garage .garage-side.advisor-opening>.garage-details{animation:garageDetailsCollapse .38s cubic-bezier(.4,0,.2,1) both}
.game-garage .garage-side.advisor-closing>.garage-details{animation:garageDetailsExpand .38s cubic-bezier(.4,0,.2,1) both}
@keyframes garageDetailsCollapse{from{flex-basis:calc(100% - 12px)}to{flex-basis:calc(50% - 6px)}}
@keyframes garageDetailsExpand{from{flex-basis:calc(50% - 6px)}to{flex-basis:100%}}
/* 顧問面板：跟上方用同一組表面樣式，才讀得出是兩塊同級的面板 */
.game-garage .garage-side>.advisor{position:static;inset:auto;width:auto;height:auto;max-height:none;flex:1;min-height:0;opacity:1;transform:none;overflow:hidden;gap:10px;padding:20px;color:#141a22;background:linear-gradient(140deg,#ffffffe0,#edf3faab);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid #ffffffcc;border-radius:24px;box-shadow:0 14px 45px #1422312b}
.game-garage .garage-side>.advisor .adv-hd{align-self:stretch;padding:0 0 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.game-garage .garage-side>.advisor .adv-log{flex:1;min-height:0;overflow-y:auto;align-items:stretch;padding:0 2px;background:none}
.game-garage .garage-side>.advisor .adv-in{margin:0}
@keyframes garageAdvisorIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.game-garage .garage-side.advisor-opening>.advisor{animation:garageAdvisorIn .34s cubic-bezier(.4,0,.2,1) both}
@media (prefers-reduced-motion:reduce){
 .game-garage .garage-side>.garage-details{transition:none}
 .game-garage .garage-side.advisor-opening>.advisor{animation:none}
}

/* 第三列維持 160：卡片靠底對齊不受影響，主圖那一列才不會多吃 10px 把車圖撐大 */
.garage-page.filter-garage.game-garage{grid-template-rows:auto minmax(0,1fr) 160px!important}
.garage-page.game-garage .garage-rail{height:160px}
.filter-garage.game-garage .garage-cards{padding:0;align-items:flex-end}
.filter-garage.game-garage .garage-card{gap:0}
.filter-garage.game-garage .garage-card span{margin-top:8px}
.filter-garage.game-garage .garage-card small{margin-top:2px}
/* 選車頁 header 對齊全站共用 header（header.css 以 1672 設計稿等比換算）：
   圖示 26、orb 36、V 標 13x17、間距 34、左右內縮 42 / 40。原本是 48px 按鈕配 29px 圖示，明顯偏大。 */
.lineup .lineup-nav{padding:0 calc(max(100vw,1200px) / 1672 * 40) 0 calc(max(100vw,1200px) / 1672 * 42)}
.lineup .lineup-nav .commerce-tools{gap:calc(max(100vw,1200px) / 1672 * 34)}
.lineup .lineup-nav .commerce-tools button{width:calc(max(100vw,1200px) / 1672 * 36);height:calc(max(100vw,1200px) / 1672 * 36)}
.lineup .lineup-nav .commerce-tools button:not(.advisor-orb) svg{width:calc(max(100vw,1200px) / 1672 * 26);height:calc(max(100vw,1200px) / 1672 * 26)}
.lineup .lineup-nav .commerce-tools .advisor-orb{width:calc(max(100vw,1200px) / 1672 * 36);height:calc(max(100vw,1200px) / 1672 * 36)}
.lineup .lineup-nav .commerce-tools .advisor-orb svg{width:calc(max(100vw,1200px) / 1672 * 13);height:calc(max(100vw,1200px) / 1672 * 17)}

/* 2026-09-22 riding refinements */

.ride .fork-heading{width:100%;text-align:center!important;margin-left:auto!important;margin-right:auto!important}
.ride .fork-heading h2{max-width:none!important;margin-left:auto!important;margin-right:auto!important}
.ride .fork-buttons{width:100%;margin-left:auto;margin-right:auto}
.ride .fork-option.disabled{cursor:not-allowed;opacity:.55;filter:saturate(.35);pointer-events:none}
.ride .fork-option.disabled .terrain-enter{color:#fff!important;background:#233853cc;border-radius:999px;padding:6px 12px}
.ride-cockpit{width:330px!important;padding:18px!important}
.cockpit-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid #dce1e7}
.cockpit-title b{font-size:13px;color:#0d2d55}.cockpit-title button{border:1px solid #1f4fe0;background:transparent;color:#1f4fe0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.ride-cockpit .cockpit-radar{height:180px}.ride-cockpit .cockpit-radar .radar{height:180px;width:100%}.ride-cockpit .cockpit-radar .radar text{font-size:13px;font-weight:700}
.cockpit-tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 11px}.cockpit-tags span{font-size:13px;font-weight:700;color:#1f4fe0;background:#edf4ff;border:1px solid #bfd3ff;border-radius:999px;padding:4px 8px}
.ride .riding-advisor{top:72px!important;right:24px!important;width:370px!important;height:auto!important;max-height:calc(100dvh - 94px);border-radius:22px!important;overflow:hidden}
.ride .riding-advisor .adv-hd{display:none!important}.ride .riding-advisor .adv-log{padding:12px!important}.ride .riding-advisor .adv-in{margin:0 12px 12px!important}
@keyframes advisor-alert{0%,100%{box-shadow:0 0 0 0 rgba(31,79,224,0);transform:scale(1)}45%{box-shadow:0 0 0 12px rgba(31,79,224,.24),0 0 26px rgba(75,134,255,.9);transform:scale(1.1)}}
.ride:has(.riding-advisor) .orb-btn{animation:advisor-alert 1s ease-in-out 3}
@media(max-width:700px){.ride .fork-options{width:92vw}.ride-cockpit{width:220px!important}.ride-cockpit .cockpit-radar,.ride-cockpit .cockpit-radar .radar{height:125px}.ride .riding-advisor{right:12px!important;width:min(360px,calc(100vw - 24px))!important}}

/* 2026-09-22 ride motion and compact states */
@keyframes cockpit-slide-in{from{opacity:0;transform:translate(-120%,-50%)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes radar-unfold{0%{opacity:0;transform:scale(.15) rotate(-8deg)}70%{opacity:1;transform:scale(1.05) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.ride-cockpit.is-intro{animation:cockpit-slide-in .78s cubic-bezier(.22,1,.36,1) both}
.ride-cockpit.is-intro .radar-fill,.ride-cockpit.is-intro .radar-grid,.ride-cockpit.is-intro .radar text{transform-box:fill-box;transform-origin:center;animation:radar-unfold .9s .38s cubic-bezier(.22,1,.36,1) both}
.ride-cockpit.is-choice{width:270px!important;box-sizing:border-box;overflow:hidden;padding:14px 16px!important;animation:cockpit-collapse .62s cubic-bezier(.22,1,.36,1) both}
@keyframes cockpit-collapse{0%{max-height:470px;opacity:1;transform:translateY(-50%) scale(1.03)}100%{max-height:88px;opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes cockpit-detail-collapse{0%{opacity:1;max-height:220px;transform:translateY(0)}55%{opacity:.15}100%{opacity:0;max-height:0;transform:translateY(-12px);margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-color:transparent}}
@keyframes cockpit-price-collapse{0%{opacity:1;max-height:24px}100%{opacity:0;max-height:0;margin:0}}
@keyframes cockpit-bike-settle{0%{margin:12px 0;transform:translateY(8px)}100%{margin:0;transform:translateY(0)}}
.ride-cockpit.is-choice .cockpit-title,.ride-cockpit.is-choice .cockpit-radar,.ride-cockpit.is-choice .cockpit-tags,.ride-cockpit.is-choice .cockpit-metrics{overflow:hidden;transform-origin:top;animation:cockpit-detail-collapse .46s cubic-bezier(.4,0,.2,1) both}

.ride-cockpit.is-choice .cockpit-bike{gap:12px;animation:cockpit-bike-settle .58s cubic-bezier(.22,1,.36,1) both}.ride-cockpit.is-choice .cockpit-bike img{width:92px;height:60px}.ride-cockpit.is-choice .cockpit-bike h2{font-size:17px;margin:0}
.ride .riding-advisor{background:#fffffff2!important;border:1px solid #ffffff!important;box-shadow:0 16px 40px #10263a30!important;backdrop-filter:blur(22px) saturate(1.15);padding:0!important}

.ride .riding-advisor .adv-in{background:transparent!important;border:0!important;border-top:1px solid #dce1e7!important;border-radius:0!important;box-shadow:none!important;margin:0!important;padding:10px 12px!important}
.ride .riding-advisor .adv-in input{background:#f6f8fb!important;border-radius:999px!important;padding-left:14px!important}
@media(max-width:700px){.ride-cockpit.is-choice{width:195px!important}.ride-cockpit.is-choice .cockpit-bike img{width:66px;height:48px}.ride-cockpit.is-choice .cockpit-bike h2{font-size:13px}}

/* 2026-09-22 ride panel expansion, finish state and advisor motion */
@keyframes radar-center-reveal{0%{opacity:0;clip-path:circle(0 at 50% 50%);transform:scale(.2)}70%{opacity:1;clip-path:circle(72% at 50% 50%);transform:scale(1.035)}100%{opacity:1;clip-path:circle(72% at 50% 50%);transform:scale(1)}}
@keyframes radar-label-reveal{0%,35%{opacity:0}100%{opacity:1}}
.ride-cockpit.is-intro .radar-fill,.ride-cockpit.is-intro .radar-grid,.ride-cockpit.is-intro .radar text{animation:none}
.ride-cockpit.is-intro .cockpit-radar .radar,.ride-cockpit.is-reopening .cockpit-radar .radar{transform-origin:center;animation:radar-center-reveal .9s .2s cubic-bezier(.22,1,.36,1) both}
.ride-cockpit.is-intro .cockpit-radar .radar text,.ride-cockpit.is-reopening .cockpit-radar .radar text{animation:radar-label-reveal .65s .55s ease both}
@keyframes cockpit-expand{0%{max-height:124px;opacity:.92;transform:translateY(-50%) scale(.985)}100%{max-height:470px;opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes cockpit-detail-expand{0%{opacity:0;max-height:0;transform:translateY(-10px)}100%{opacity:1;max-height:220px;transform:translateY(0)}}

/* 首頁三台車的接地陰影。車圖是去背圖，原本直接「浮」在石板路上。
   著地線從按鈕「上緣」量，跟下方車名兩行的高度無關（那個會隨字級變）：
   --mb-b 是各張圖裡車身底緣佔圖高的比例（量出來的：三張圖下方留白不一樣多），
   --mb-z 是 transform:scale 的倍率，縮放以中心為準所以要扣掉 (z-1)/2 的上溢。 */
.marketing-bike{--mb-h:clamp(190px,30vh,330px);--mb-z:1.2;--mb-b:.839}
.marketing-bike[data-featured="ebike"]{--mb-b:.855}
.marketing-bike[data-featured="sl0"]{--mb-b:.872}
.marketing-bike img{height:var(--mb-h)}
.marketing-bike::after{content:'';position:absolute;z-index:-1;pointer-events:none;
 left:50%;transform:translateX(-50%);
 top:calc(var(--mb-h) * (var(--mb-z) * var(--mb-b) - (var(--mb-z) - 1) / 2 - .05));
 width:calc(var(--mb-h) * 1.44);height:calc(var(--mb-h) * .1);
 /* 三層：兩個輪子的接地暗點（約在寬度 17% 與 83% 處）＋整體的淡影 */
 background:radial-gradient(ellipse 20% 52% at 17% 52%,#16212cbf 0%,#16212c4d 48%,transparent 72%),
  radial-gradient(ellipse 20% 52% at 83% 52%,#16212cbf 0%,#16212c4d 48%,transparent 72%),
  radial-gradient(ellipse at 50% 50%,#16212c59 0%,#16212c30 42%,transparent 74%);
 filter:blur(5px);transition:opacity .25s,transform .25s}
.marketing-bike:hover::after{opacity:.7;transform:translateX(-50%) scale(1.04)}
@media(max-width:700px){.marketing-bike{--mb-h:160px;--mb-z:1.1}
 .marketing-bike::after{width:calc(var(--mb-h) * 1.35)}}

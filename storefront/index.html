<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIANT · More Than a Bike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A111C;
  --bg-2:#101A28;
  --ink:#FFFFFF;
  --ink-70:rgba(255,255,255,.72);
  --ink-50:rgba(255,255,255,.52);
  --line:rgba(255,255,255,.16);
  --brand:#06038D;
  --ai:#2F6BFF;
  --sans:"Inter","Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --shell:min(1840px,calc(100vw - 72px));
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-width:1200px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- 導覽列 ---------- */
.nav{position:absolute;inset:0 0 auto;z-index:20;height:76px}
.nav-in{width:var(--shell);margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;position:relative}
.logo svg{height:22px;width:auto;color:#fff}
.links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;font-size:17px;font-weight:500}
.links a{opacity:.92;transition:opacity .2s}
.links a:hover{opacity:1}
.icons{display:flex;gap:30px}
.icons svg{width:26px;height:26px}

/* ---------- 主視覺 ---------- */
.hero{position:relative;height:clamp(640px,56vw,760px);overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,rgba(6,10,18,.72) 0%,rgba(6,10,18,.38) 30%,rgba(6,10,18,0) 55%),
             linear-gradient(180deg,rgba(6,10,18,.5) 0%,rgba(6,10,18,0) 16%,rgba(6,10,18,0) 58%,var(--bg) 100%)}
.hero-copy{position:relative;z-index:2;width:var(--shell);margin:0 auto;padding-top:clamp(128px,11vw,168px)}
.hero h1{font-size:clamp(78px,6.4vw,112px);line-height:.98;font-weight:800;letter-spacing:-.035em}
.hero .sub{margin-top:18px;font-size:clamp(24px,1.9vw,32px);font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.9)}
.btn-ghost{margin-top:36px;display:inline-flex;align-items:center;gap:14px;height:60px;padding:0 42px;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;font-size:17px;font-weight:700;letter-spacing:.04em;transition:background .25s,color .25s}
.btn-ghost:hover{background:#fff;color:#0A111C}
.btn-ghost svg{width:20px;height:20px}

/* ---------- AI 小幫手：逛一下才出現，可關、可再叫出來 ---------- */
.assist{position:absolute;z-index:6;right:calc((100vw - var(--shell))/2);top:clamp(270px,22vw,340px);width:min(500px,30vw);
  padding:26px 26px 24px;border-radius:14px;background:rgba(14,22,36,.78);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 70px rgba(0,0,0,.45);
  opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.assist.on{opacity:1;transform:none;pointer-events:auto}
.assist-top{display:flex;gap:18px}
.spark{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#4B86FF,#1E4FE0);box-shadow:0 8px 22px rgba(47,107,255,.45)}
.spark svg{width:26px;height:26px;color:#fff}
.assist h3{font-size:21px;font-weight:700;letter-spacing:.02em;margin-top:2px}
.assist p{margin-top:12px;font-size:15.5px;line-height:1.8;color:var(--ink-70)}
.assist .x{position:absolute;right:18px;top:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-70)}
.assist .x:hover{background:rgba(255,255,255,.1);color:#fff}
.assist .x svg{width:20px;height:20px}
.assist-acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.assist-acts button{height:46px;border-radius:6px;font-size:15px;font-weight:700;letter-spacing:.04em;transition:background .2s,border-color .2s}
.assist-acts .yes{background:#fff;color:#0A111C}
.assist-acts .yes:hover{background:#E6ECF7}
.assist-acts .no{border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.88)}
.assist-acts .no:hover{border-color:#fff}
/* 收起來之後留一顆在右下角，想問的時候自己叫 */
.fab{position:fixed;right:28px;bottom:28px;z-index:30;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#4B86FF,#1E4FE0);box-shadow:0 12px 30px rgba(30,79,224,.5);
  opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.fab.on{opacity:1;transform:none;pointer-events:auto}
.fab svg{width:28px;height:28px;color:#fff}

/* ---------- 騎乘情境 ---------- */
.scenes{position:relative;z-index:5;width:var(--shell);margin:-172px auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.scene{position:relative;height:clamp(150px,10.5vw,190px);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.scene:hover img{transform:scale(1.05)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,10,18,.66) 0%,rgba(6,10,18,.25) 60%,rgba(6,10,18,.1) 100%),linear-gradient(0deg,rgba(6,10,18,.45),rgba(6,10,18,0) 60%)}
.scene .txt{position:absolute;z-index:1;left:22px;right:78px;bottom:22px}
.scene b{display:block;font-size:clamp(22px,1.6vw,28px);font-weight:700;letter-spacing:.04em}
.scene small{display:block;margin-top:8px;font-size:14px;letter-spacing:.03em;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene .go{position:absolute;z-index:1;right:20px;bottom:24px;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);display:grid;place-items:center;transition:background .25s,color .25s}
.scene:hover .go{background:#fff;color:#0A111C}
.scene .go svg{width:20px;height:20px}

/* ---------- 熱門車款 ---------- */
.popular{width:var(--shell);margin:0 auto;padding:54px 0 90px}
.pop-head{display:flex;align-items:baseline;gap:22px}
.pop-head h2{font-size:28px;font-weight:700;letter-spacing:.04em}
.pop-head p{font-size:16px;color:var(--ink-50);letter-spacing:.04em}
.pop-head .all{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink-70)}
.pop-head .all:hover{color:#fff}
.pop-head .all svg{width:18px;height:18px}
.grid{margin-top:34px;display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.pc .shot{position:relative;aspect-ratio:1.38;border-radius:4px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#FAFBFC 0%,#E3E7EC 70%,#CDD3DA 100%)}
.pc .shot img{position:absolute;left:8%;top:10%;width:84%;height:74%;object-fit:contain;transition:transform .6s var(--ease)}
.pc:hover .shot img{transform:scale(1.04)}
.pc .fav{position:absolute;right:14px;top:14px;width:30px;height:30px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.pc .fav svg{width:26px;height:26px}
.pc .fav.on{color:#E0344B}
.pc .fav.on path{fill:currentColor}
.pc .dots{position:absolute;left:16px;bottom:14px;display:flex;gap:8px}
.pc .dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pc .badge{position:absolute;right:12px;bottom:12px;padding:4px 9px;border-radius:5px;background:#1F4FE0;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}
.pc h4{margin-top:18px;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pr{margin-top:8px;font-size:17px;color:rgba(255,255,255,.86)}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="logo" href="./" aria-label="GIANT">
      <svg viewBox="35 6 113 16" fill="currentColor" aria-hidden="true"><path d="M124.059 7.36985H147.59L141.381 10.9245H135.512L129.796 21.5918H122.687L128.403 10.9245H122.155L124.059 7.36985Z"/><path d="M66.9978 7.36985L59.3743 21.5918H65.8164L73.4399 7.36985H66.9978Z"/><path d="M73.433 10.9245C74.4858 8.96126 76.932 7.36985 78.8952 7.36985H98.8574L91.2304 21.5918H83.6277L85.4276 18.2352H77.7242L81.6159 15.9767H86.6473L89.4548 10.7264H82.078C81.9147 10.7334 80.6221 10.8133 80.0835 11.7827L76.7096 18.0789C75.6776 20.0212 73.2662 21.5918 71.3273 21.5918H67.7136L73.433 10.9245Z"/><path d="M119.546 7.36985H100.807L93.2213 21.5918H100.331L106.123 10.7264H112.568C112.568 10.7264 114.212 10.7264 113.5 12.0398L108.406 21.5918H115.515L121.203 10.9245C122.252 8.96126 121.509 7.36985 119.546 7.36985Z"/><path d="M53.8183 12.839H62.0638L59.277 18.0789C58.2451 20.0212 55.8336 21.5918 53.8947 21.5918H35.5796L41.3129 10.9245C42.3657 8.96126 44.8154 7.36985 46.7786 7.36985H65.3404L59.496 10.7264H49.4228C49.4228 10.7264 48.5472 10.7229 48.092 11.5395L44.4957 18.2352H51.9628L53.1859 15.9767H48.4117L53.8183 12.839Z"/></svg>
    </a>
    <nav class="links"><a href="#">Bikes</a><a href="#">Gear</a><a href="#">Apparel</a><a href="#">Explore</a><a href="#">Support</a></nav>
    <div class="icons">
      <a href="#" aria-label="搜尋"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></a>
      <a href="#" aria-label="會員"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.3-4 4.4-6 8-6s6.7 2 8 6"/></svg></a>
      <a href="#" aria-label="購物車"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h2.6l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h9.1a1.6 1.6 0 0 0 1.6-1.2L21.5 8H6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg></a>
    </div>
  </div>
</header>

<section class="hero">
  <img class="hero-img" src="img/hero.webp" alt="">
  <div class="hero-copy">
    <h1>More<br>Than a Bike</h1>
    <p class="sub">騎，讓世界更大。</p>
    <a class="btn-ghost" href="#popular">探索全部車款<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </div>

  <aside class="assist" id="assist" role="dialog" aria-labelledby="assistTitle">
    <button class="x" id="assistClose" type="button" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="assist-top">
      <span class="spark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.6 2.4 7.9 7.5 9.5-5.1 1.6-7 4.9-7.5 9.5-.5-4.6-2.4-7.9-7.5-9.5 5.1-1.6 7-4.9 7.5-9.5z"/></svg></span>
      <div>
        <h3 id="assistTitle">需要我幫忙嗎？</h3>
        <p>我可以幫你快速比較你正在看的車款，<br>或依照你的騎乘情境推薦合適的選擇。</p>
      </div>
    </div>
    <div class="assist-acts">
      <button class="yes" id="assistYes" type="button">好，幫我看看</button>
      <button class="no" id="assistNo" type="button">我先逛逛</button>
    </div>
  </aside>
</section>

<section class="scenes" aria-label="依騎乘情境選車">
  <a class="scene" href="#"><img src="img/scenes/city.webp" alt=""><span class="txt"><b>城市移動</b><small>上班・上課・日常騎乘</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="scene" href="#"><img src="img/scenes/road.webp" alt=""><span class="txt"><b>長途公路</b><small>追求速度・挑戰更遠</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="scene" href="#"><img src="img/scenes/gravel.webp" alt=""><span class="txt"><b>多變路況</b><small>柏油・碎石・探索未知</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="scene" href="#"><img src="img/scenes/mtb.webp" alt=""><span class="txt"><b>山林越野</b><small>征服地形・釋放本能</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="scene" href="#"><img src="img/scenes/ebike.webp" alt=""><span class="txt"><b>電動輔助</b><small>更輕鬆・去更遠的地方</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
</section>

<section class="popular" id="popular">
  <div class="pop-head">
    <h2>熱門車款</h2>
    <p>探索最受歡迎的車款，開啟你的下一段騎乘旅程。</p>
    <a class="all" href="#">查看全部車款<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </div>
  <div class="grid" id="grid"></div>
</section>

<button class="fab" id="fab" type="button" aria-label="叫出小幫手"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.6 2.4 7.9 7.5 9.5-5.1 1.6-7 4.9-7.5 9.5-.5-4.6-2.4-7.9-7.5-9.5 5.1-1.6 7-4.9 7.5-9.5z"/></svg></button>

<script>
const $ = id => document.getElementById(id);

/* 車名與價格沿用 02 的車款資料；色點為示意 */
const BIKES = [
  {n:'FastRoad AR Advanced 1', pr:62800,  img:'fastroad', dots:['#C9B79A','#1B1F26','#2A3340','#1D3C7A'], badge:'NEW'},
  {n:'Revolt Advanced SL 0',   pr:168000, img:'revolt',   dots:['#3B3F2C','#5E6470','#1B1F26','#474B52']},
  {n:'Talon E+',               pr:79800,  img:'talon',    dots:['#2B3F6E','#7C858F','#C8CDD3','#5A6068']},
  {n:'Escape Disc 2',          pr:16800,  img:'escape',   dots:['#1B1F26','#2E5AA8','#D8D3C4'], badge:'BEST SELLER'},
  {n:'Explore E+',             pr:78000,  img:'explore',  dots:['#2B3F6E','#1B1F26','#474B52']},
  {n:'Trance X Advanced Pro 29', pr:178000, img:'trance', dots:['#1B1F26','#7FA3A0','#8C7A4E','#474B52']},
];
const heart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20.3S3.5 15.1 3.5 9.1A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8.5 2.5c0 6-8.5 11.2-8.5 11.2z"/></svg>';
$('grid').innerHTML = BIKES.map(b =>
  '<a class="pc" href="#">' +
    '<div class="shot"><img src="img/bikes/' + b.img + '.webp" alt="' + b.n + '">' +
      '<span class="fav" role="button" aria-label="收藏">' + heart + '</span>' +
      '<span class="dots">' + b.dots.map(c => '<i style="background:' + c + '"></i>').join('') + '</span>' +
      (b.badge ? '<span class="badge">' + b.badge + '</span>' : '') +
    '</div>' +
    '<h4 title="' + b.n + '">' + b.n + '</h4><p class="pr">NT$ ' + b.pr.toLocaleString('en-US') + '</p>' +
  '</a>').join('');
document.querySelectorAll('.pc .fav').forEach(f => f.onclick = e => { e.preventDefault(); f.classList.toggle('on'); });

/* 小幫手不一進站就跳：停留一下才出現。收起後右下角留一顆，隨時可以自己叫回來。 */
const assist = $('assist'), fab = $('fab');
const openAssist = () => { assist.classList.add('on'); fab.classList.remove('on'); };
const closeAssist = () => { assist.classList.remove('on'); fab.classList.add('on'); };
setTimeout(openAssist, 2400);
$('assistClose').onclick = closeAssist;
$('assistNo').onclick = closeAssist;
$('assistYes').onclick = closeAssist;   /* 下一步（分類頁＋AI 面板）尚未接上 */
fab.onclick = openAssist;
</script>
</body>
</html>

<main class="shell"><nav class="crumb" aria-label="麵包屑"><a href="index.html">首頁</a>　/　自行車　/　<span id="breadcrumb">所有車款</span></nav><div class="layout"><aside class="filters" aria-label="車款篩選"><h2>篩選車款</h2><fieldset><legend>自行車分類</legend><div id="categories"></div></fieldset><div id="officialFilters"></div><fieldset><legend>預算上限</legend><input type="range" id="budget" min="0" max="320000" step="100" value="320000" aria-label="預算上限"><p class="filter-price" id="budgetLabel"></p></fieldset><button class="clear" id="reset">清除所有條件</button></aside><section aria-label="商品列表"><div class="intro" id="intro"><strong>慢慢看，我在這裡。</strong><span class="muted">想看懂車款差異，隨時找我。</span><button class="text-button" id="greetHelp">一起看看 ↗</button><button class="dismiss" id="dismissIntro">我先逛逛 ×</button></div><div id="summary" class="summary" hidden></div><div class="toolbar"><h2><span id="listTitle">所有車款</span><small id="count" aria-live="polite"></small></h2><select id="sort" aria-label="車款排序"><option value="default">精選排序</option><option value="low">價格由低至高</option><option value="high">價格由高至低</option></select></div><div id="activeFilters" class="active-filters"></div><div class="products" id="products"></div></section></div><footer class="foot">GIANT　 /　 Ride a brighter tomorrow.</footer></main>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="智慧搜尋" hidden><div class="drawer-head"><h2>智慧搜尋</h2><button id="closeChat" aria-label="關閉智慧搜尋">×</button></div><div class="messages" id="messages"><h3>我們一起縮小範圍。</h3><p>不用先懂規格，說說想怎麼騎。<br>我會依你目前的篩選，一起看看有哪些選擇。</p><div class="suggestions"><button data-intent="city">城市通勤，週末去河濱</button><button data-intent="gravel">想騎遠一點，也想走碎石路</button><button data-intent="mtb">想探索山林與起伏路段</button></div></div><form class="composer" id="composer"><input id="query" placeholder="說說想怎麼騎，或輸入預算…" aria-label="輸入找車需求"><button aria-label="送出">↑</button></form></aside><script src="catalog.js?v=20260916-products"></script><script>
const BIKES=window.GIANT_CATALOG.bikes,FACETS=window.GIANT_CATALOG.facets;
const $=id=>document.getElementById(id), labels={road:'公路自行車',mtb:'登山車',gravel:'越野與礫石公路',ebike:'電動輔助自行車',city:'運動通勤與平把車款',kids:'童車與青少年車'};
const reasons={city:'可以先比較日常通勤與平把運動車款。',road:'以公路騎乘為方向，先比較這些車系。',gravel:'想探索柏油以外的路面，可以先比較這些跨界車款。',mtb:'往山林探索，可以先比較登山車款。',ebike:'想騎得更輕鬆，可以先了解電動輔助車款。'};
let selected=new Set(),facetState={},intent=null,reminded=false,muted=false,opened=false,lastFocus=null,idleTimer,visits=[],hoverTimer;
const params=new URLSearchParams(location.search);params.getAll('category').forEach(c=>{if(labels[c])selected.add(c)});
FACETS.forEach(f=>facetState[f.id]=new Set(params.getAll(f.id).filter(v=>f.options.some(o=>o.value===v))));
const MAX_PRICE=Math.ceil(Math.max(...BIKES.map(b=>b.max))/10000)*10000;
$('budget').max=MAX_PRICE;$('budget').value=params.has('budget')&&Number.isFinite(Number(params.get('budget')))?Math.max(0,Math.min(MAX_PRICE,Number(params.get('budget')))):MAX_PRICE;
if(['low','high'].includes(params.get('sort')))$('sort').value=params.get('sort');
const favorites=new Set();
const matchCategory=b=>!selected.size||b.cats.some(c=>selected.has(c));
const matchFacets=b=>FACETS.every(f=>!facetState[f.id].size||[...facetState[f.id]].some(v=>b.tags.includes(v)));
function filtered(){return BIKES.filter(b=>matchCategory(b)&&matchFacets(b)&&b.pr<=Number($('budget').value))}
function syncURL(){const q=new URLSearchParams();selected.forEach(c=>q.append('category',c));FACETS.forEach(f=>facetState[f.id].forEach(v=>q.append(f.id,v)));if(Number($('budget').value)<MAX_PRICE)q.set('budget',$('budget').value);if($('sort').value!=='default')q.set('sort',$('sort').value);history.replaceState(null,'','bikes.html'+(q.size?'?'+q:''))}
function drawFilters(){
 $('categories').innerHTML=Object.entries(labels).map(([v,t])=>`<label><input type="checkbox" value="${v}" ${selected.has(v)?'checked':''}>${t}<span>${BIKES.filter(b=>b.cats.includes(v)).length}</span></label>`).join('');
 const pool=BIKES.filter(matchCategory);
 $('officialFilters').innerHTML=FACETS.map(f=>{const opts=f.options.filter(o=>pool.some(b=>b.tags.includes(o.value))||facetState[f.id].has(o.value));return opts.length?`<details ${f.id==='bestfor'||facetState[f.id].size?'open':''}><summary>${f.label}</summary>${opts.map(o=>`<label><input type="checkbox" data-facet="${f.id}" value="${o.value}" ${facetState[f.id].has(o.value)?'checked':''}>${o.label}<span>${pool.filter(b=>b.tags.includes(o.value)).length}</span></label>`).join('')}</details>`:''}).join('');
}
function render(){let list=filtered();const sort=$('sort').value;if(sort==='low')list.sort((a,b)=>a.pr-b.pr);if(sort==='high')list.sort((a,b)=>b.pr-a.pr);if(intent)list.sort((a,b)=>Number(b.cats.includes(intent))-Number(a.cats.includes(intent)));
 $('budgetLabel').textContent='NT$ '+Number($('budget').value).toLocaleString()+' 以內';$('count').textContent=`${list.length} 個車系／車款`;const title=selected.size===1?labels[[...selected][0]]:'所有車款';$('listTitle').textContent=intent?'一起看看這些車':title;$('breadcrumb').textContent=title;
 $('summary').hidden=!intent;if(intent){$('summary').innerHTML=`<span>依「${labels[intent]}」優先整理，保留你的篩選條件。<br>符合方向的車款會排在前面，其他選擇也還在。</span><button class="text-button" id="undo">還原排序</button>`;$('undo').onclick=()=>{intent=null;render()}}
 const chips=[...[...selected].map(v=>({group:'category',v,t:labels[v]})),...FACETS.flatMap(f=>[...facetState[f.id]].map(v=>({group:f.id,v,t:f.options.find(o=>o.value===v).label})))];
 $('activeFilters').innerHTML=chips.map(c=>`<button data-group="${c.group}" data-value="${c.v}" aria-label="移除 ${c.t}">${c.t} ×</button>`).join('');
 $('products').innerHTML=list.length?list.map(b=>`<article class="card" data-key="${b.k}" tabindex="0" aria-label="瀏覽 ${b.n}"><a href="${b.url}"><div class="photo"><img src="${b.img}" alt="${b.n}" loading="lazy"></div><div class="meta"><span class="category">${labels[b.cat]}</span><span class="year">${b.year}</span><h3>${b.n}</h3><p class="price">NT$ ${b.pr.toLocaleString()}${b.max>b.pr?' – '+b.max.toLocaleString():''}</p>${intent&&b.cats.includes(intent)?`<p class="reason">${reasons[intent]||''}</p>`:''}</div></a><button class="favorite" data-favorite="${b.k}" aria-label="收藏 ${b.n}" aria-pressed="${favorites.has(b.k)}">${favorites.has(b.k)?'♥':'♡'}</button></article>`).join(''):'<div class="empty">目前條件下沒有車款。<br>試試放寬類型或預算。<button class="secondary" id="emptyReset">清除篩選</button></div>';
 $('emptyReset')?.addEventListener('click',reset);document.querySelectorAll('[data-favorite]').forEach(el=>el.onclick=()=>{const k=el.dataset.favorite;favorites.has(k)?favorites.delete(k):favorites.add(k);el.setAttribute('aria-pressed',favorites.has(k));el.textContent=favorites.has(k)?'♥':'♡'});
 document.querySelectorAll('.card').forEach(el=>{const record=()=>{clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>{visits.push(el.dataset.key);if(visits.length>10)visits.shift();schedule()},1200)};el.addEventListener('pointerenter',record);el.addEventListener('focusin',record);el.addEventListener('pointerleave',()=>clearTimeout(hoverTimer));el.addEventListener('focusout',()=>clearTimeout(hoverTimer))});
}
function reset(){selected.clear();FACETS.forEach(f=>facetState[f.id].clear());intent=null;$('budget').value=MAX_PRICE;$('sort').value='default';syncURL();drawFilters();render()}
$('reset').onclick=reset;
$('categories').onchange=e=>{e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);const pool=BIKES.filter(matchCategory);FACETS.forEach(f=>{for(const v of facetState[f.id])if(!pool.some(b=>b.tags.includes(v)))facetState[f.id].delete(v)});intent=null;syncURL();drawFilters();render()};
$('officialFilters').onchange=e=>{const set=facetState[e.target.dataset.facet];if(!set)return;e.target.checked?set.add(e.target.value):set.delete(e.target.value);intent=null;syncURL();render()};
$('activeFilters').onclick=e=>{const el=e.target.closest('[data-group]');if(!el)return;(el.dataset.group==='category'?selected:facetState[el.dataset.group]).delete(el.dataset.value);intent=null;syncURL();drawFilters();render()};
$('budget').oninput=()=>{syncURL();render()};$('sort').onchange=()=>{intent=null;syncURL();render()};
function hideIntro(){ $('intro').hidden=true }$('dismissIntro').onclick=hideIntro;
function schedule(){clearTimeout(idleTimer);if(muted||reminded||opened||document.hidden)return;idleTimer=setTimeout(nudge,new Set(visits).size>=2&&visits.length>=4?12000:40000)}
function nudge(){if(document.hidden||opened||muted||reminded||/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName))return;if(!filtered().length)return;const cards=[...document.querySelectorAll('.card')];const visible=cards.find(c=>{const r=c.getBoundingClientRect();return r.top>64&&r.bottom<innerHeight});if(!visible){schedule();return}reminded=true;hideIntro();const box=document.createElement('div');box.className='assist-inline';box.innerHTML='<div><h3>有幾台都喜歡，還拿不定主意？</h3><p>可以一起看差異，不用急著做決定。</p></div><div class="actions"><button class="primary" id="inlineHelp">幫我整理看看</button><button class="secondary" id="inlineDismiss">我再看看</button></div>';visible.after(box);$('inlineHelp').onclick=openChat;$('inlineDismiss').onclick=()=>{muted=true;box.remove()}}
function openChat(){lastFocus=document.activeElement;opened=true;reminded=true;clearTimeout(idleTimer);hideIntro();document.querySelector('.assist-inline')?.remove();$('drawer').hidden=false;$('searchToggle').setAttribute('aria-expanded','true');$('query').focus()}
function closeChat(){opened=false;$('drawer').hidden=true;$('searchToggle').setAttribute('aria-expanded','false');(lastFocus?.isConnected?lastFocus:$('searchToggle')).focus()}
$('searchToggle').setAttribute('aria-controls','drawer');$('searchToggle').onclick=openChat;$('greetHelp').onclick=openChat;$('closeChat').onclick=closeChat;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened)closeChat()});
function message(text,who){const el=document.createElement('div');el.className='message '+(who||'');el.textContent=text;$('messages').append(el);el.scrollIntoView({block:'nearest'});return el}
function respond(text,category){document.querySelector('.suggestions')?.remove();message(text,'me');let c=category;if(!c){if(/河濱|通勤|城市/.test(text))c='city';else if(/碎石|gravel/i.test(text))c='gravel';else if(/山|越野/.test(text))c='mtb';else if(/電/.test(text))c='ebike';else if(/公路|速度|長途/.test(text))c='road'}const amount=text.match(/(\d+(?:\.\d+)?)\s*(萬|元)/);let price=amount?Number(amount[1])*(amount[2]==='萬'?10000:1):null;if(!c&&!price){message('可以告訴我想騎的路況，例如城市、河濱、山路；或輸入預算，例如 6 萬以內。');return}const available=filtered().filter(b=>b.pr<=(price||Infinity)&&(!c||b.cats.includes(c)));const msg=message(available.length?'可以，我先依這個方向整理。按下方按鈕後，會更新列表，保留你原本的篩選。':'這個預算和目前的類型篩選沒有符合的車款。可以先調整左側條件，再一起看看。');if(!available.length)return;const apply=document.createElement('button');apply.className='primary';apply.textContent='套用到商品列表';apply.onclick=()=>{if(price)$('budget').value=Math.max(0,Math.min(Number($('budget').value),price));intent=c||null;if(!c)$('sort').value='low';syncURL();render();closeChat()};msg.append(document.createElement('br'),apply)}
document.querySelectorAll('[data-intent]').forEach(b=>b.onclick=()=>respond(b.textContent,b.dataset.intent));$('composer').onsubmit=e=>{e.preventDefault();const t=$('query').value.trim();if(t){$('query').value='';respond(t)}};
['pointerdown','keydown','scroll'].forEach(t=>document.addEventListener(t,schedule,{passive:true}));document.addEventListener('visibilitychange',schedule);drawFilters();render();schedule();
</script></body></html>

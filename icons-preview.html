<!doctype html><meta charset="utf-8">
<style>body{background:#fff;margin:0;padding:34px;font:13px/1.6 system-ui;color:#333}
.row{display:flex;gap:36px;align-items:flex-end;margin-bottom:28px}
.i{text-align:center}.i svg{display:block;margin:0 auto 8px;width:72px;height:72px}
.dark{background:#0B0D16;padding:26px;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:14px;color:#fff}
.chip svg{width:16px;height:16px;flex:none}
.rail{margin-top:24px;display:flex;flex-direction:column;gap:9px;width:220px}
.rail span{display:flex;align-items:center;gap:9px;font-size:13px}
.rail svg{width:16px;height:16px;flex:none}
</style>
<div class="row" id="big"></div>
<div class="dark" id="chips"></div>
<div class="rail" id="rail"></div>
<script>
const IC={
 daily :'<circle cx="3.667" cy="11.667" r="2.333"/><circle cx="12.333" cy="11.667" r="2.333"/><circle cx="10" cy="3.333" r="0.667"/><path d="M8 11.667V9.333L6 7.333l2.667-2L10 7.333h1.333"/>',
 ebike :'<path d="M9.5 2 4 9.2h3.6L6.5 14 12 6.8H8.4L9.5 2Z"/>',
 gravel:'<path d="M4 14 6.8 2.6"/><path d="M12 14 9.2 2.6"/><path d="M8 4.6v1.7M8 8.6v1.7M8 12.6V14"/>',
 mtb   :'<path d="M1.8 13.6 6.2 4.8l3.2 5.4 1.9-3.2 3.1 6.6Z"/>',
 kids  :'<circle cx="5.2" cy="4.2" r="1.9"/><path d="M2 14v-2.2a3.2 3.2 0 0 1 6.4 0V14"/><circle cx="11.6" cy="7.2" r="1.5"/><path d="M9.1 14v-1.4a2.5 2.5 0 0 1 5 0V14"/>'
};
const L={daily:'日常騎乘',ebike:'E-bike 電動輔助',gravel:'越野&礫石公路',mtb:'登山車',kids:'親子/童車'};
const svg=k=>'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';
big.innerHTML=Object.keys(IC).map(k=>'<div class="i">'+svg(k)+'<span>'+L[k]+'</span></div>').join('');
chips.innerHTML=Object.keys(IC).map(k=>'<span class="chip">'+svg(k)+L[k]+'</span>').join('');
rail.innerHTML=Object.keys(IC).map(k=>'<span>'+svg(k)+L[k]+'</span>').join('');
</script>
